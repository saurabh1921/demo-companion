<style>
  /* page-local: guest app column */
  .ga { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .ga-persona { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
  .ga-persona .who { flex: 1; min-width: 0; }
  .ga-persona .who .small { display: block; }
  .ga-persona select { width: auto; max-width: 62%; height: 34px; font-size: 13.5px; }
  .ga-tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 4px; box-shadow: var(--shadow);
    position: relative; z-index: 20; }
  .ga-tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; color: var(--muted);
    font: 600 12px var(--sans); padding: 7px 4px; border-radius: 10px; cursor: pointer; }
  .ga-tabs button svg { width: 20px; height: 20px; }
  .ga-tabs button.on { color: var(--brand); background: var(--accent-soft); }
  #gaWelcome { display: flex; flex-direction: column; gap: 14px; }
  #gaWelcome:empty { display: none; }
  .ga-view[hidden] { display: none !important; }
  .ga-view { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  .ga-hero { background: linear-gradient(140deg, var(--brand), color-mix(in srgb, var(--brand) 55%, var(--accent))); color: var(--brand-ink); border: 0; position: relative; overflow: hidden; }
  .ga-hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 140px; height: 140px; border-radius: 50%; background: var(--sand); opacity: .22; }
  .ga-hero .eyebrow { color: inherit; opacity: .75; }
  .ga-hero h1 { margin-bottom: 4px; overflow-wrap: anywhere; }
  .ga-hero .room-wait { font-size: 15px; font-weight: 600; color: var(--muted); margin: 10px 0 2px; }
  .ga-hero .room { font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin: 10px 0 2px; overflow-wrap: anywhere; }
  .ga-hero .dates { opacity: .9; font-size: 13.5px; }
  .ga-hero .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; position: relative; z-index: 1; }
  .ga-hero .pill { background: rgba(255,255,255,.18); color: inherit; }
  :root[data-theme="dark"] .ga-hero .pill { background: rgba(0,0,0,.14); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; overflow-wrap: anywhere; }
  .ga-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ga-row .sp { flex: 1; }
  .ga-act h2 { margin-bottom: 2px; }
  .ga-act .ic { width: 30px; height: 30px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
  .ga-act .ic svg { width: 17px; height: 17px; }
  .ga-act .btn.pri { width: 100%; height: 44px; margin-top: 12px; }
  .ga-act .field { margin-top: 12px; }
  .ga-act .toggle { margin-top: 12px; }
  .ga-out { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
  .ga-out:empty { display: none; }
  .wait { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
  .key { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 12px; background: var(--good-soft); color: var(--good); }
  .key.warn { background: var(--warn-soft); color: var(--warn); } .key.bad { background: var(--bad-soft); color: var(--bad); }
  .key svg { width: 26px; height: 26px; flex: none; }
  .key b { display: block; font-size: 15px; color: inherit; }
  .key span { font-size: 12.5px; }
  .big { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .bkg { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .bkg:first-of-type { border-top: 0; }
  .bkg .when { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; min-width: 84px; }
  .bkg .what { flex: 1; min-width: 0; overflow-wrap: anywhere; }

  .bill-tot { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .lines { list-style: none; margin: 0; padding: 0; }
  .lines li { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .lines li:last-child { border-bottom: 0; }
  .lines .d { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .lines .d .small { display: block; }
  .lines .a { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }

  .chat { display: flex; flex-direction: column; gap: 10px; min-height: 240px; }
  .msg { max-width: 88%; padding: 10px 12px; border-radius: 14px; font-size: 14px; overflow-wrap: anywhere; }
  .msg.me { align-self: flex-end; background: var(--brand); color: var(--brand-ink); border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .msg.ag { align-self: flex-start; background: var(--panel-2); border-bottom-left-radius: 4px; }
  .msg.ag p:last-child, .msg.ag ul:last-child, .msg.ag ol:last-child { margin-bottom: 0; }
  .msg.ag ul, .msg.ag ol { padding-left: 18px; margin: 0 0 .6em; }
  .msg.ag table { border-collapse: collapse; font-size: 12.5px; display: block; overflow-x: auto; }
  .msg.ag td, .msg.ag th { border: 1px solid var(--line); padding: 4px 6px; }
  .msg.ag pre { overflow-x: auto; white-space: pre-wrap; }
  .msg .prog { color: var(--muted); font-size: 12.5px; display: flex; gap: 8px; align-items: center; }
  .chat-form { display: flex; gap: 8px; margin-top: 12px; }
  .chat-form textarea { flex: 1; min-width: 0; height: 44px; min-height: 44px; max-height: 140px; resize: none; }
  .chat-form .btn { height: 44px; }
  .sugg { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .sugg button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 6px 11px; font: 500 12.5px var(--sans); cursor: pointer; text-align: left; }
  .sugg button:hover { background: var(--panel-2); }

  /* mobile: bottom tab bar with safe-area padding */
  @media (max-width: 640px) {
    .br-main { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
    .ga-tabs { position: fixed; left: 0; right: 0; bottom: 0; top: auto; border-radius: 0; border: 0; border-top: 1px solid var(--line);
      padding: 6px 10px calc(6px + env(safe-area-inset-bottom)); z-index: 45; background: color-mix(in srgb, var(--panel) 94%, transparent); backdrop-filter: blur(10px); }
    .ga-hero .room { font-size: 26px; }
  }
</style>

<body data-page="guest-app">
<main class="br-main">
  <div class="ga">
    <div class="card ga-persona">
      <label class="who small muted" for="gaPersona" style="font-weight:600">Signed in as guest</label>
      <select class="input" id="gaPersona" aria-label="Guest persona"></select>
    </div>

    <nav class="ga-tabs" id="gaTabs" aria-label="Guest app sections">
      <button type="button" data-tab="home" class="on" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
      <button type="button" data-tab="bill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Bill</button>
      <button type="button" data-tab="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Concierge</button>
    </nav>

    <!-- HOME -->
    <section class="ga-view" id="vHome">
      <div id="gaWelcome"></div>

      <div class="card ga-act">
        <h2><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>Mobile check-in</h2>
        <p class="small muted">Skip the desk: Boomi allocates your room and issues a digital key.</p>
        <div class="field"><label for="gaArr">Arrival time</label><input class="input" id="gaArr" type="time" value="15:00"></div>
        <button class="btn pri" type="button" id="gaCheckin">Check in now</button>
        <div class="ga-out" id="gaCheckinOut" aria-live="polite"></div>
      </div>

      <div class="card ga-act">
        <h2><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"/></svg></span>Express check-out</h2>
        <p class="small muted">Settle your bill to the card on file and leave when you are ready.</p>
        <label class="toggle"><input type="checkbox" id="gaUnlinked" checked> Include charges not yet linked to my folio</label>
        <button class="btn pri" type="button" id="gaCheckout">Check out</button>
        <div class="ga-out" id="gaCheckoutOut" aria-live="polite"></div>
      </div>
    </section>

    <!-- BILL -->
    <section class="ga-view" id="vBill" hidden>
      <div class="card">
        <div class="ga-row"><h2 style="margin:0">My bill</h2><span class="sp"></span><button class="btn sm" type="button" id="gaBillReload">Refresh</button></div>
        <div class="ga-out" id="gaBill" aria-live="polite"></div>
      </div>
    </section>

    <!-- CONCIERGE -->
    <section class="ga-view" id="vChat" hidden>
      <div class="card">
        <div class="ga-row"><h2 style="margin:0">Concierge</h2><span class="sp"></span><button class="btn sm" type="button" id="gaChatNew">New chat</button></div>
        <p class="small muted" style="margin-top:4px">Live Boomi Agent Studio concierge. Replies can take up to a minute.</p>
        <div class="chat" id="gaChat" aria-live="polite"></div>
        <div class="sugg" id="gaSugg"></div>
        <form class="chat-form" id="gaChatForm">
          <textarea class="input" id="gaChatIn" rows="1" placeholder="Ask the concierge…" aria-label="Message"></textarea>
          <button class="btn pri" type="submit" id="gaChatGo">Send</button>
        </form>
      </div>
    </section>
  </div>
</main>
<script src="br.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
(function () {
  "use strict";
  var PERSONAS = [
    { id: "LOY-200101", name: "Elena Vance" },
    { id: "LOY-200102", name: "Marcus Thorne" },
    { id: "LOY-200103", name: "Sophia Lin" }
  ];
  var P_KEY = "br_guest_persona";
  var $ = function (id) { return document.getElementById(id); };
  var esc = BR.esc;
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function ssSet(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} }

  var persona = PERSONAS.filter(function (p) { return p.id === lsGet(P_KEY); })[0] || PERSONAS[0];
  var gen = 0;            // bumps on persona switch so stale responses are dropped
  var profile = null;     // guests[0] from live full picture
  var billLoaded = false;

  /* ---------- small helpers ---------- */
  function nice(s) { s = String(s == null ? "" : s).replace(/_/g, " ").toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); }
  function fmtDate(d) {
    if (!d) return "";
    var t = new Date(String(d).length <= 10 ? d + "T12:00:00" : d);
    if (isNaN(t)) return String(d);
    return t.toLocaleDateString(undefined, { day: "numeric", month: "short" }) + (String(d).length > 10 ? " " + t.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }) : "");
  }
  function nights(a, b) { var x = new Date(a + "T12:00:00"), y = new Date(b + "T12:00:00"); var n = Math.round((y - x) / 864e5); return isNaN(n) || n <= 0 ? null : n; }
  function waiting(label) { return '<div class="wait"><span class="spin"></span><span>' + esc(label) + ' <span class="mono">(5–60 s)</span></span></div>'; }
  function bad(msg) { return '<div class="note bad">' + esc(msg) + "</div>"; }
  function secs(ms) { return ms != null ? '<span class="small muted mono">' + (ms / 1000).toFixed(1) + " s via Boomi</span>" : ""; }
  function list(arr) { return (arr || []).map(function (w) { return typeof w === "string" ? w : (w && (w.message || w.detail || w.action)) || JSON.stringify(w); }); }
  function warnBlock(sum) {
    sum = sum || {}; var out = "";
    var w = list(sum.warnings), n = list(sum.nextActions);
    if (w.length) out += '<div class="note warn"><b>Heads up</b><br>' + w.map(esc).join("<br>") + "</div>";
    if (n.length) out += '<div class="note"><b>Next</b><br>' + n.map(esc).join("<br>") + "</div>";
    return out;
  }
  var ICON_LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  var ICON_CARD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>';
  var ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>';

  /* ---------- persona picker ---------- */
  var sel = $("gaPersona");
  sel.innerHTML = PERSONAS.map(function (p) { return '<option value="' + esc(p.id) + '">' + esc(p.name) + "</option>"; }).join("");
  sel.value = persona.id;
  // A room number is only shown once Boomi says the guest is checked in (in house).
  function inHouse(st) { return /IN_HOUSE|CHECKED_IN|IN-HOUSE/i.test(String((st && st.status) || "")); }
  function checkedOut(st) { return /CHECKED_OUT|DEPARTED/i.test(String((st && st.status) || "")); }
  function roomIfIn(st) { return inHouse(st) ? (st.room || "") : ""; }
  function initials(n) { return String(n || "").split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w.charAt(0).toUpperCase(); }).join(""); }
  // the shared persona strip IS the selected guest; enriched with live data once the full picture arrives
  function paintWho(g) {
    var st = g && g.stay || {};
    BR.setPersona({ name: (g && g.legalName) || persona.name, role: "Guest · " + ((g && g.vipStatus) ? g.vipStatus + " member" : "mobile app"),
      initials: initials((g && g.legalName) || persona.name), extra: [roomIfIn(st) || (checkedOut(st) ? "Checked out" : (g ? "Not checked in yet" : "")), (g && g.guestId) || persona.id].filter(Boolean) });
  }

  /* ---------- tabs ---------- */
  var VIEWS = { home: "vHome", bill: "vBill", chat: "vChat" };
  function show(tab) {
    Object.keys(VIEWS).forEach(function (k) { $(VIEWS[k]).hidden = k !== tab; });
    Array.prototype.forEach.call($("gaTabs").querySelectorAll("button"), function (b) {
      var on = b.getAttribute("data-tab") === tab; b.classList.toggle("on", on);
      if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    if (tab === "bill" && !billLoaded) loadBill();
    if (tab === "chat") renderChat();
    window.scrollTo(0, 0);
  }
  $("gaTabs").addEventListener("click", function (e) { var b = e.target.closest("button[data-tab]"); if (b) show(b.getAttribute("data-tab")); });

  /* ---------- home: live guest full picture ---------- */
  function loadGuest() {
    var g0 = gen; profile = null;
    $("gaWelcome").innerHTML = '<div class="card"><div class="skel" style="width:40%;margin-bottom:10px"></div><div class="skel" style="width:70%;height:24px;margin-bottom:12px"></div>' + waiting("Fetching your stay from Boomi") + "</div>";
    BR.call("guest", { guest_name: persona.name }).then(function (r) {
      if (g0 !== gen) return;
      var d = r.data || {}, list = d.guests || [];
      var g = list.filter(function (x) { return x.guestId === persona.id; })[0] || list[0];
      if (!d.matched || !g) { $("gaWelcome").innerHTML = '<div class="card">' + bad("Boomi found no guest record for " + persona.name + ".") + "</div>"; return; }
      profile = g; paintWho(g); renderWelcome(g, r.ms);
    }).catch(function (e) {
      if (g0 !== gen) return;
      $("gaWelcome").innerHTML = '<div class="card">' + bad("Could not load your stay: " + e.message) + '<button class="btn sm" type="button" id="gaRetry" style="margin-top:10px">Try again</button></div>';
      $("gaRetry").onclick = loadGuest;
    });
  }
  function renderWelcome(g, ms) {
    var s = g.stay || {}, n = nights(s.checkIn, s.checkOut), first = String(g.legalName || persona.name).split(" ")[0];
    var prefs = String(g.preferences || "").split(/;\s*/).filter(Boolean);
    var html = '<div class="card ga-hero"><div class="eyebrow">Welcome back</div><h1>Hello, ' + esc(first) + "</h1>" +
      (roomIfIn(s) ? '<div class="room">' + esc(s.room) + "</div>"
        : checkedOut(s) ? '<div class="room-wait">Checked out · thank you for staying</div>'
        : '<div class="room-wait">Your room is assigned at check-in</div><button class="btn pri sm" type="button" id="gaGoCheckin" style="margin:6px 0 4px">Check in now</button>') +
      (s.checkIn || s.checkOut ? '<div class="dates">' + esc(fmtDate(s.checkIn)) + " → " + esc(fmtDate(s.checkOut)) + (n ? " · " + n + " night" + (n > 1 ? "s" : "") : "") + "</div>" : "") +
      '<div class="pills">' + (s.status ? BR.pill(nice(s.status)) : "") + (g.vipStatus ? BR.pill(g.vipStatus + " member") : "") + (g.isVip ? BR.pill("VIP") : "") + "</div></div>";
    var dl = "";
    if (g.accountableHost) dl += "<dt>Your host</dt><dd>" + esc(g.accountableHost) + "</dd>";
    if (g.preferredCurrency) dl += "<dt>Currency</dt><dd>" + esc(g.preferredCurrency) + "</dd>";
    if (g.email) dl += "<dt>Email</dt><dd>" + esc(g.email) + "</dd>";
    if (g.phone) dl += "<dt>Phone</dt><dd>" + esc(g.phone) + "</dd>";
    html += '<div class="card"><div class="ga-row"><h3 style="margin:0">Your stay</h3><span class="sp"></span>' + secs(ms) + "</div>" +
      (dl ? '<dl class="kv" style="margin:10px 0 0">' + dl + "</dl>" : "") +
      (prefs.length ? '<hr class="divider"><div class="eyebrow">Preferences on file</div><div class="chips">' + prefs.map(function (p) { return '<span class="chip">' + esc(p) + "</span>"; }).join("") + "</div>" : "") +
      ((g.amenityBookings || []).length ? '<hr class="divider"><div class="eyebrow">Your bookings</div>' + g.amenityBookings.map(function (b) {
        return '<div class="bkg"><div class="when">' + esc(fmtDate(b.start)) + '</div><div class="what">' + esc(b.description || nice(b.type)) +
          (b.status ? " " + BR.pill(nice(b.status), BR.statusKind(b.status)) : "") + (b.note ? '<div class="small muted">' + esc(b.note) + "</div>" : "") + "</div></div>";
      }).join("") : "") + "</div>";
    $("gaWelcome").innerHTML = html;
    var go = document.getElementById("gaGoCheckin");
    if (go) go.onclick = function () { var b = $("gaCheckin"); b.scrollIntoView({ behavior: "smooth", block: "center" }); b.focus(); };
  }

  /* ---------- check-in ---------- */
  function busy(btn, on, label) { btn.disabled = on; btn.innerHTML = on ? '<span class="spin"></span> Working…' : esc(label); }
  $("gaCheckin").onclick = function () {
    var btn = this, out = $("gaCheckinOut"), g0 = gen;
    var arr = $("gaArr").value || "15:00";
    busy(btn, true); out.innerHTML = waiting("Checking you in with Boomi");
    BR.call("checkin", { guest_id: persona.id, channel: "MOBILE_APP", arrival_time: arr, simulate_key_system_down: "false", simulate_room_not_ready: "false" })
      .then(function (r) {
        if (g0 !== gen) return;
        var d = r.data || {}; out.innerHTML = renderCheckin(d, r.ms);
        // checked in: now the room can be shown on the welcome card and in the persona strip
        var room = (d.allocation && d.allocation.room) || (d.handoff && d.handoff.room);
        if (profile && room && !/FAIL/i.test(String(d.status || ""))) {
          profile.stay = Object.assign({}, profile.stay || {}, { room: room, status: "IN_HOUSE" });
          paintWho(profile); renderWelcome(profile, r.ms);
        }
      })
      .catch(function (e) { if (g0 === gen) out.innerHTML = bad("Check-in failed: " + e.message); })
      .then(function () { busy(btn, false, "Check in now"); });
  };
  function renderCheckin(d, ms) {
    var a = d.allocation || {}, steps = d.steps || [], lock = null;
    steps.forEach(function (s) { if (s.system === "DOOR_LOCK") lock = s; });
    var status = String(d.status || "");
    var key;
    if (lock && /FAIL/i.test(lock.status)) key = '<div class="key bad">' + ICON_CARD + "<div><b>Collect your key at the front desk</b><span>" + esc(lock.detail || "The door-lock system did not confirm your digital key.") + "</span></div></div>";
    else if (a.ready === false) key = '<div class="key warn">' + ICON_LOCK + "<div><b>Digital key pending</b><span>Activates once the room is inspected" + (a.readyBy ? ", by " + esc(a.readyBy) : "") + ".</span></div></div>";
    else if (/FAIL|ERROR/i.test(status)) key = "";
    else key = '<div class="key">' + ICON_OK + "<div><b>Digital key ready" + (a.room ? " · " + esc(a.room) : "") + "</b><span>" + (lock && lock.detail ? esc(lock.detail) : "Your phone opens your door from your arrival time.") + "</span></div></div>";
    var meta = [a.floor ? "Floor " + a.floor : "", a.roomType ? nice(a.roomType) : "", a.hkStatus ? nice(a.hkStatus) : ""].filter(Boolean).join(" · ");
    var res = d.reservation || {};
    return '<div class="ga-row">' + BR.pill(nice(status || "unknown"), BR.statusKind(status)) + '<span class="sp"></span>' + secs(ms) + "</div>" +
      (a.room ? '<div><div class="big">' + esc(a.room) + '</div><div class="small muted">' + esc(meta) + (d.checkInId ? ' · <span class="mono">' + esc(d.checkInId) + "</span>" : "") + "</div></div>" : "") +
      key +
      ((a.features || []).length ? '<div class="chips">' + a.features.map(function (f) { return '<span class="chip">' + esc(nice(f)) + "</span>"; }).join("") + "</div>" : "") +
      (res.confirmationNo ? '<div class="small muted">Reservation <span class="mono">' + esc(res.confirmationNo) + "</span>" + (res.nights ? " · " + esc(res.nights) + " nights" : "") + (res.ratePlan ? " · " + esc(res.ratePlan) : "") + "</div>" : "") +
      warnBlock(d.summary) +
      (d.error || d.message ? bad(d.error || d.message) : "");
  }

  /* ---------- check-out ---------- */
  $("gaCheckout").onclick = function () {
    var btn = this, out = $("gaCheckoutOut"), g0 = gen;
    if (!confirm("Check out " + persona.name + " now? Your bill will be charged to the card on file.")) return;
    busy(btn, true); out.innerHTML = waiting("Settling your bill and checking out with Boomi");
    BR.call("checkout", { guest_id: persona.id, channel: "MOBILE_APP", confirm_unlinked_charges: $("gaUnlinked").checked ? "true" : "false", simulate_payment_declined: "false" })
      .then(function (r) { if (g0 === gen) { out.innerHTML = renderCheckout(r.data || {}, r.ms); billLoaded = false; } })
      .catch(function (e) { if (g0 === gen) out.innerHTML = bad("Check-out failed: " + e.message); })
      .then(function () { busy(btn, false, "Check out"); });
  };
  function renderCheckout(d, ms) {
    var p = d.payment || {}, b = d.bill || {}, t = b.totals || {}, l = d.loyalty || {}, status = String(d.status || "");
    var cur = p.currency || t.currency || b.folioCurrency;
    var amount = p.amount != null ? p.amount : t.balanceLocal;
    var pk = BR.statusKind(p.status);
    var html = '<div class="ga-row">' + BR.pill(nice(status || "unknown"), BR.statusKind(status)) + '<span class="sp"></span>' + secs(ms) + "</div>";
    if (amount != null) html += '<div class="key ' + (pk === "bad" ? "bad" : pk === "warn" ? "warn" : "") + '">' + (pk === "bad" ? ICON_CARD : ICON_OK) + "<div><b>" + esc(BR.money(amount, cur)) +
      (p.status ? " · " + esc(nice(p.status)) : "") + "</b><span>" + esc([p.method, p.authCode ? "auth " + p.authCode : ""].filter(Boolean).join(" · ")) + "</span></div></div>";
    var dl = "";
    if (b.folioNumber) dl += "<dt>Folio</dt><dd class=\"mono\">" + esc(b.folioNumber) + "</dd>";
    if (t.lineCount != null) dl += "<dt>Charges</dt><dd>" + esc(t.lineCount) + " lines</dd>";
    if (t.balanceUSD != null && cur !== "USD") dl += "<dt>In USD</dt><dd>" + esc(BR.money(t.balanceUSD, "USD")) + "</dd>";
    if ((b.resolutions || []).length) dl += "<dt>Corrected</dt><dd>" + esc(b.resolutions.length) + " charge" + (b.resolutions.length > 1 ? "s" : "") + " re-posted in " + esc(b.folioCurrency || cur || "") + "</dd>";
    if (l.pointsAwarded != null) dl += "<dt>Points earned</dt><dd>" + esc(Number(l.pointsAwarded).toLocaleString()) + (l.tier ? " · " + esc(l.tier) : "") + "</dd>";
    if (dl) html += '<dl class="kv" style="margin:0">' + dl + "</dl>";
    if ((b.leftForReview || []).length) html += '<div class="note warn">' + esc(b.leftForReview.length) + " charge(s) left for front-desk review.</div>";
    html += warnBlock(d.summary);
    if (d.error || d.message) html += bad(d.error || d.message);
    return html;
  }

  /* ---------- bill ---------- */
  $("gaBillReload").onclick = function () { loadBill(); };
  function loadBill() {
    var out = $("gaBill"), g0 = gen, btn = $("gaBillReload");
    billLoaded = true; btn.disabled = true;
    out.innerHTML = waiting("Pulling your folio from every outlet via Boomi");
    BR.call("folio", { guest_id: persona.id }).then(function (r) {
      if (g0 !== gen) return;
      var d = r.data || {};
      if (d.matched === false) { out.innerHTML = bad("No open folio found for " + persona.name + "."); return; }
      out.innerHTML = renderBill(d, r.ms);
    }).catch(function (e) { if (g0 === gen) { billLoaded = false; out.innerHTML = bad("Could not load your bill: " + e.message); } })
      .then(function () { btn.disabled = false; });
  }
  var SRC = { OPERA_PMS: "Room (Opera PMS)", SIMPHONY_POS: "Dining (Simphony POS)" };
  function renderBill(d, ms) {
    var t = d.totals || {}, rep = d.reportingCurrency || "USD", lines = (d.lines || []).slice().sort(function (a, b) { return String(a.postingDate).localeCompare(String(b.postingDate)); });
    var html = '<div class="bill-tot"><div><div class="eyebrow">Balance due</div><div class="big">' + esc(BR.money(t.balanceUSD, rep)) + "</div>" +
      '<div class="small muted">' + esc([d.folioNumber ? "Folio " + d.folioNumber : "", profile && !inHouse(profile.stay) ? "" : d.room, d.property].filter(Boolean).join(" · ")) + "</div></div>" + secs(ms) + "</div>";
    var dl = "";
    if (t.chargesUSD != null) dl += "<dt>Charges</dt><dd>" + esc(BR.money(t.chargesUSD, rep)) + "</dd>";
    if (t.creditsUSD) dl += "<dt>Credits</dt><dd>" + esc(BR.money(t.creditsUSD, rep)) + "</dd>";
    if (d.folioCurrency && d.folioCurrency !== rep) dl += "<dt>Folio currency</dt><dd>" + esc(d.folioCurrency) + "</dd>";
    var bySrc = t.bySource || {};
    Object.keys(bySrc).forEach(function (k) { var s = bySrc[k] || {}; dl += "<dt>" + esc(SRC[k] || nice(k)) + "</dt><dd>" + esc(BR.money(s.localAmount, s.localCurrency)) + (s.lineCount != null ? ' <span class="muted">· ' + esc(s.lineCount) + " lines</span>" : "") + "</dd>"; });
    if (dl) html += '<dl class="kv" style="margin:0">' + dl + "</dl>";
    if (lines.length) html += '<ul class="lines">' + lines.map(function (l) {
      var flags = (l.dataQualityFlags || []).map(function (f) { return " " + BR.pill(nice(f), "warn"); }).join("");
      return '<li><div class="d">' + esc(l.description || l.lineId) + flags + '<span class="small muted">' + esc([fmtDate(l.postingDate), l.outlet].filter(Boolean).join(" · ")) + "</span></div>" +
        '<div class="a">' + esc(BR.money(l.amount, l.currency)) + (l.currency && l.currency !== rep && l.amountUSD != null ? '<div class="small muted" style="font-weight:400">' + esc(BR.money(l.amountUSD, rep)) + "</div>" : "") + "</div></li>";
    }).join("") + "</ul>";
    else html += '<div class="note">No charges posted yet.</div>';
    if (t.lineCount != null && t.lineCount > lines.length) html += '<div class="small muted">Boomi returned line detail for ' + lines.length + " of " + esc(t.lineCount) + " charges; the balance covers all of them.</div>";
    var issues = (d.dataQuality && d.dataQuality.issues) || [];
    if (issues.length) html += '<div class="note warn"><b>' + issues.length + " charge" + (issues.length > 1 ? "s" : "") + " will be corrected at check-out</b><br>" +
      issues.map(function (i) { return esc(i.detail || nice(i.flag)) + ' <span class="mono">' + esc(i.lineId || "") + "</span>"; }).join("<br>") + "</div>";
    var un = d.possibleUnlinkedCharges || [];
    if (un.length) html += '<div class="note warn"><b>' + un.length + " possible charge" + (un.length > 1 ? "s" : "") + " not yet on your folio</b><br>" +
      un.map(function (u) { return esc([u.outlet, u.postingDate, BR.money(u.amount, u.currency)].filter(Boolean).join(" · ")); }).join("<br>") + "</div>";
    return html;
  }

  /* ---------- concierge chat ---------- */
  var chatLog = {};  // per persona, this page view only (session id persists in sessionStorage)
  var chatBusy = false, ctrl = null;
  function sidKey() { return "br_guest_chat_" + persona.id; }
  function log() { return chatLog[persona.id] || (chatLog[persona.id] = []); }
  function md(s) {
    try { if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(String(s || ""))); } catch (e) {}
    return "<p>" + esc(s).replace(/\n/g, "<br>") + "</p>";
  }
  var SUGG = ["What's on my schedule today?", "Book a table for two tonight", "Can I get a late check-out?"];
  function renderChat() {
    var box = $("gaChat"), items = log();
    if (!items.length) box.innerHTML = '<div class="note">Hi ' + esc(persona.name.split(" ")[0]) + ", I'm your concierge. Ask me anything about your stay.</div>";
    else box.innerHTML = items.map(function (m) {
      if (m.role === "me") return '<div class="msg me">' + esc(m.text) + "</div>";
      if (m.role === "err") return bad(m.text);
      return '<div class="msg ag">' + (m.text ? md(m.text) : "") + (m.pending ? '<div class="prog"><span class="spin"></span>' + esc(m.prog || "Concierge is thinking…") + "</div>" : "") + "</div>";
    }).join("");
    $("gaSugg").innerHTML = items.length ? "" : SUGG.map(function (s) { return '<button type="button">' + esc(s) + "</button>"; }).join("");
    var last = box.lastElementChild; if (last && items.length && last.scrollIntoView) last.scrollIntoView({ block: "nearest" });
  }
  $("gaSugg").addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) send(b.textContent); });
  $("gaChatForm").onsubmit = function (e) { e.preventDefault(); send($("gaChatIn").value); };
  $("gaChatIn").addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(this.value); } });
  $("gaChatNew").onclick = function () { if (ctrl) ctrl.abort(); ssSet(sidKey(), null); chatLog[persona.id] = []; chatBusy = false; setChatBusy(false); renderChat(); };
  function setChatBusy(on) { chatBusy = on; $("gaChatGo").disabled = on; $("gaChatGo").innerHTML = on ? '<span class="spin"></span>' : "Send"; }
  function send(text) {
    text = String(text || "").trim(); if (!text || chatBusy) return;
    var pid = persona.id, items = log(), sid = ssGet(sidKey());
    $("gaChatIn").value = "";
    items.push({ role: "me", text: text });
    var reply = { role: "ag", text: "", pending: true }; items.push(reply);
    setChatBusy(true); renderChat();
    // first turn of a session tells the agent who the guest is
    var stay = profile && profile.stay ? profile.stay : null;
    var msg = sid ? text : "[Guest app · " + persona.name + " (" + pid + ")" + (roomIfIn(stay) ? ", " + stay.room : ", not checked in yet") + "] " + text;
    ctrl = window.AbortController ? new AbortController() : null;
    var gotFinal = false;
    BR.chat(msg, sid, function (evt, o) {
      if (evt === "start" && o.session_id) ssSet("br_guest_chat_" + pid, o.session_id);
      else if (evt === "progress_notification") reply.prog = o.content || (o.type ? nice(o.type) : reply.prog);
      else if (evt === "delta" && o.content) reply.text += o.content;
      else if (evt === "message") { if (o.session_id) ssSet("br_guest_chat_" + pid, o.session_id); if (o.content != null) { reply.text = String(o.content); gotFinal = true; } }
      else if (evt === "error") items.push({ role: "err", text: o.content || o.message || "Concierge error" });
      if (persona.id === pid) renderChat();
    }, ctrl && ctrl.signal).then(function () {
      reply.pending = false;
      if (!reply.text && !gotFinal) { items.splice(items.indexOf(reply), 1); if (!items.some(function (m) { return m.role === "err"; })) items.push({ role: "err", text: "The concierge ended without a reply. Please try again." }); }
    }).catch(function (e) {
      reply.pending = false;
      if (!reply.text) items.splice(items.indexOf(reply), 1);
      if (e.name !== "AbortError") items.push({ role: "err", text: "Concierge unavailable: " + e.message });
    }).then(function () { ctrl = null; if (persona.id === pid) { setChatBusy(false); renderChat(); } });
  }

  /* ---------- persona switch ---------- */
  sel.onchange = function () {
    persona = PERSONAS.filter(function (p) { return p.id === sel.value; })[0] || PERSONAS[0];
    lsSet(P_KEY, persona.id); gen++; paintWho();
    if (ctrl) ctrl.abort();
    setChatBusy(false);
    $("gaCheckinOut").innerHTML = ""; $("gaCheckoutOut").innerHTML = ""; $("gaBill").innerHTML = ""; billLoaded = false;
    $("gaCheckin").disabled = false; $("gaCheckin").textContent = "Check in now";
    $("gaCheckout").disabled = false; $("gaCheckout").textContent = "Check out";
    loadGuest();
    if (!$("vBill").hidden) loadBill();
    if (!$("vChat").hidden) renderChat();
  };

  BR.ready(function () { paintWho(); loadGuest(); });
})();
</script>
</body>
</html>
