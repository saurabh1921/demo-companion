<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boomi Bank App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  :root { --bezel: #08131f; --hero-a: #0a1f3c; --hero-b: #0d766f; --hero-ink: #f1f7fb; --sheet-scrim: rgba(6, 14, 24, .45); }
  html, body { height: 100%; }
  .stage { min-height: 100%; }
  .phone { position: relative; width: 100%; height: 100vh; height: 100dvh; background: var(--bg); overflow: hidden; }
  .caption { display: none; }
  @media (min-width: 760px) and (min-height: 640px) {
    body { background: var(--bg-2); }
    .stage { display: flex; align-items: center; justify-content: center; gap: 48px; padding: 24px; min-height: 100vh; }
    .phone { width: 390px; height: min(844px, calc(100vh - 48px)); flex: none; border: 11px solid var(--bezel); border-radius: 52px;
      box-shadow: 0 30px 80px rgba(8, 18, 30, .28), 0 0 0 1px rgba(255, 255, 255, .06) inset; }
    .phone::before { content: ""; position: absolute; top: 9px; left: 50%; transform: translateX(-50%); width: 104px; height: 28px; border-radius: 16px; background: var(--bezel); z-index: 40; }
    .caption { display: block; max-width: 350px; }
    .app { padding-top: 26px; }
  }
  .caption .eyebrow { margin-bottom: 8px; }
  .caption h1 { font-size: 30px; margin: 0 0 10px; }
  .caption p { color: var(--ink-2); margin: 0 0 12px; font-size: 14.5px; }
  .caption ul { margin: 0 0 14px; padding-left: 18px; color: var(--ink-2); font-size: 13.5px; }
  .caption li { margin: 4px 0; }
  .caption .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .pseg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; margin: 0 0 14px; }
  .pseg button { font: 500 13.5px var(--sans); padding: 7px 12px; border: 0; background: var(--panel); color: var(--ink); cursor: pointer; }
  .pseg button + button { border-left: 1px solid var(--line-2); }
  .pseg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .sheet .pseg { margin: 4px 0 10px; }

  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
  .apphead { display: flex; align-items: center; gap: 10px; padding: 12px 16px 10px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
  .brandmark { display: flex; align-items: center; gap: 9px; font: 600 16px var(--serif); letter-spacing: -.01em; }
  .brandmark .mark::after { box-shadow: 0 0 0 2px var(--panel); }
  .apphead .sp { flex: 1; }
  .gear { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0; }
  .gear:hover { color: var(--ink); border-color: var(--line-2); }
  .gear svg { width: 17px; height: 17px; }
  .screens { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; -webkit-overflow-scrolling: touch; }
  .screen { padding: 0 0 28px; }
  .screen.in { animation: slidein .38s cubic-bezier(.2, .7, .2, 1); }
  @keyframes slidein { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .acard { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 16px; margin: 14px 16px 0; min-width: 0; }
  .acard.offer { border-color: var(--gold); background: var(--gold-soft); }
  .acard.offer .ot { font: 600 17px var(--serif); margin: 0 0 4px; }
  .acard.offer p { margin: 0 0 6px; font-size: 13.5px; }
  .acard.offer .on { font-size: 12px; color: var(--muted); }
  .acard.offer .odone { font-size: 13px; font-weight: 600; color: var(--good); margin-top: 8px; }
  .acard h3 { font: 600 12px var(--sans); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; flex-direction: row; }
  .pchip { font: 500 12.5px var(--sans); background: var(--accent-soft); color: var(--ink); border-radius: 999px; padding: 4px 10px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13.5px; margin: 0; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
  .src { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 11.5px; color: var(--muted); }
  .src .badge { font-size: 10px; padding: 2px 7px; }
  .skel { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--bg-2), var(--panel-2), var(--bg-2)); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; margin: 8px 0; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .primary-cta { display: block; width: calc(100% - 32px); margin: 18px 16px 0; padding: 15px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font: 600 16.5px var(--sans); cursor: pointer; box-shadow: 0 6px 18px rgba(13, 118, 111, .28); }
  .primary-cta:disabled { opacity: .55; cursor: default; }
  .ghost { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); font: 500 14px var(--sans); cursor: pointer; text-decoration: none; }
  .ghost:hover { border-color: var(--accent); background: var(--accent-soft); }
  .ghost.solid { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .ghost:disabled { opacity: .5; cursor: default; }
  .btnrow { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btnrow .ghost { flex: 1 1 120px; padding: 10px; font-size: 13.5px; }

  .hero { margin: 0; padding: 22px 18px 54px; color: var(--hero-ink); background:
      radial-gradient(120% 80% at 85% 0%, rgba(240, 163, 94, .35), transparent 55%), linear-gradient(160deg, var(--hero-a), var(--hero-b)); }
  .hero .hi { font-size: 13px; opacity: .8; margin: 0 0 4px; }
  .hero h1 { font-size: 26px; margin: 0 0 10px; color: #fff; }
  .hero .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; opacity: .92; }
  .segpill { display: inline-flex; align-items: center; gap: 5px; font: 600 11.5px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: #3a1a05; background: linear-gradient(135deg, #f7d3ae, #e08a45); padding: 4px 10px; border-radius: 999px; }
  .lift { margin-top: -38px; position: relative; }
  .check { list-style: none; margin: 0; padding: 0; }
  .check li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .check li:first-child { border-top: 0; padding-top: 2px; }
  .check .tick { width: 24px; height: 24px; border-radius: 50%; background: var(--good-soft); color: var(--good); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
  .check .txt { flex: 1; min-width: 0; }
  .check .sub { font-size: 12px; color: var(--muted); }
  .bigamt { font: 600 30px/1.1 var(--serif); }
  .loanrow { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .loanrow:first-of-type { border-top: 0; }
  .loanrow .s { font-size: 12px; color: var(--muted); }
  .loanrow .r { text-align: right; white-space: nowrap; font-weight: 600; }
  .fixnote { margin-top: 10px; padding: 9px 11px; border-radius: 12px; background: var(--accent-soft); border-left: 3px solid var(--accent); font-size: 12.5px; }
  .fixnote.warn { background: var(--warn-soft); border-left-color: var(--warn); }

  .progress { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 24px; }
  .orb { position: relative; width: 132px; height: 132px; margin-bottom: 26px; }
  .orb span { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; animation: ripple 2.6s ease-out infinite; }
  .orb span:nth-child(2) { animation-delay: .85s; }
  .orb span:nth-child(3) { animation-delay: 1.7s; }
  .orb i { position: absolute; inset: 34px; border-radius: 50%; background: radial-gradient(circle at 70% 30%, #f0a35e 0 14%, transparent 15%), linear-gradient(160deg, #2ec4b4, #0a1f3c); box-shadow: 0 8px 24px rgba(13, 118, 111, .35); animation: bob 2.6s ease-in-out infinite; }
  @keyframes ripple { 0% { transform: scale(.45); opacity: .7; } 100% { transform: scale(1.1); opacity: 0; } }
  @keyframes bob { 50% { transform: translateY(-4px); } }
  .rot { font: 600 21px var(--serif); min-height: 30px; transition: opacity .35s; }
  .rot.fade { opacity: 0; }
  .progress .sub { color: var(--muted); font-size: 13.5px; margin: 8px 0 0; max-width: 280px; }
  .progress .elapsed { font: 500 12px var(--mono); color: var(--muted); margin-top: 18px; }

  .replay { margin: 12px 16px 0; padding: 8px 12px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); border: 1px solid currentColor; font-size: 12.5px; display: flex; gap: 8px; align-items: flex-start; }
  .replay strong { letter-spacing: .06em; }
  .ready { padding: 20px 18px 50px; color: var(--hero-ink); background: radial-gradient(120% 80% at 85% 0%, rgba(240, 163, 94, .32), transparent 55%), linear-gradient(160deg, var(--hero-a), var(--hero-b)); }
  .ready .ok { width: 34px; height: 34px; border-radius: 50%; background: rgba(255, 255, 255, .18); display: grid; place-items: center; font-weight: 700; margin-bottom: 10px; }
  .ready h1 { font-size: 24px; margin: 0 0 4px; color: #fff; }
  .ready .amt { font: 600 36px/1.1 var(--serif); color: #fff; margin: 6px 0 4px; }
  .ready .sm { font-size: 13px; opacity: .85; }
  .notice { margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; background: var(--warn-soft); color: var(--ink); border-left: 3px solid var(--warn); font-size: 13.5px; }
  .notice.bad { background: var(--bad-soft); border-left-color: var(--bad); }
  .bankcard { position: relative; border-radius: 16px; padding: 16px; color: #fff; min-height: 160px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
    background: radial-gradient(90% 120% at 100% 0%, rgba(240, 163, 94, .55), transparent 55%), linear-gradient(135deg, #0a1f3c, #0d766f 75%, #2ec4b4); box-shadow: 0 10px 26px rgba(8, 30, 50, .35); }
  .bankcard.locked { filter: grayscale(.6); }
  .bankcard .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 600 13px var(--sans); white-space: nowrap; }
  .bankcard .chip { width: 34px; height: 25px; border-radius: 5px; background: linear-gradient(135deg, #f6dfb3, #c99a4c); }
  .bankcard .num { font: 500 15px var(--mono); letter-spacing: .08em; white-space: nowrap; }
  .bankcard .bot { display: flex; justify-content: space-between; align-items: flex-end; font-size: 12px; }
  .bankcard .wallet { font: 600 10.5px var(--sans); letter-spacing: .08em; text-transform: uppercase; background: rgba(255, 255, 255, .18); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .acct { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .acct:first-of-type { border-top: 0; padding-top: 2px; }
  .acct .s { font: 11.5px var(--mono); color: var(--muted); }
  .welcome { background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px; padding: 11px 13px; font: 15px/1.5 var(--serif); }
  .welcome-from { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  details.what summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px; }
  details.what summary::-webkit-details-marker { display: none; }
  details.what summary .chev { margin-left: auto; color: var(--muted); transition: transform .2s; }
  details.what[open] summary .chev { transform: rotate(90deg); }
  .what .big { font: 600 15.5px var(--serif); }
  .what .sm { font-size: 12px; color: var(--muted); }
  .steps { list-style: none; margin: 12px 0 0; padding: 0; }
  .steps li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 4px 10px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .steps .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; background: var(--good); }
  .steps .dot.WARN { background: var(--warn); }
  .steps .dot.FAILED { background: var(--bad); }
  .steps .sys { font-weight: 600; }
  .steps .act { color: var(--ink-2); }
  .steps .tags { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .mt2 { font: 600 9.5px var(--mono); letter-spacing: .04em; padding: 2px 6px; border-radius: 5px; background: var(--bg-2); color: var(--muted); }
  .mt2.LIVE, .mt2.OK { background: var(--good-soft); color: var(--good); }
  .mt2.WARN { background: var(--warn-soft); color: var(--warn); }
  .mt2.FAILED { background: var(--bad-soft); color: var(--bad); }
  .what .notes { margin: 10px 0 0; padding: 8px 10px; border-radius: 10px; background: var(--warn-soft); font-size: 12.5px; }
  .track { list-style: none; margin: 4px 0 0; padding: 0; }
  .track li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; font-size: 13.5px; }
  .track .tk { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-2); display: grid; place-items: center; flex: none; font-size: 11px; font-weight: 700; color: transparent; }
  .track li.done .tk { border-color: var(--good); background: var(--good); color: #fff; }
  .track li.next .tk { border-color: var(--accent); }
  .track .s { font-size: 12px; color: var(--muted); }
  .clear { margin-top: 10px; padding: 12px; border-radius: 14px; background: var(--good-soft); border: 1px solid var(--good); font-size: 13.5px; }
  .clear strong { font: 600 17px var(--serif); display: block; color: var(--good); }

  .failed { text-align: center; padding: 56px 24px 24px; }
  .failed .ic { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 16px; background: var(--bad-soft); color: var(--bad); display: grid; place-items: center; font: 700 28px var(--sans); }
  .failed.warn .ic { background: var(--warn-soft); color: var(--warn); }
  .failed h1 { font-size: 23px; margin: 0 0 8px; }
  .failed p { color: var(--ink-2); margin: 0 auto 8px; max-width: 300px; }
  .failed .err { font: 12px var(--mono); color: var(--muted); margin: 10px auto 22px; max-width: 300px; overflow-wrap: anywhere; }

  .scrim { position: absolute; inset: 0; background: var(--sheet-scrim); z-index: 50; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 51; background: var(--panel); border-radius: 22px 22px 0 0; padding: 10px 18px 22px; transform: translateY(105%); transition: transform .25s cubic-bezier(.2, .7, .2, 1); box-shadow: 0 -10px 30px rgba(0, 0, 0, .2); }
  .open .scrim { opacity: 1; pointer-events: auto; }
  .open .sheet { transform: none; }
  .sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line-2); margin: 0 auto 12px; }
  .sheet h2 { font-size: 17px; margin: 0 0 2px; }
  .sheet .sub { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  .tog { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); cursor: pointer; font-size: 14px; position: relative; }
  .tog .txt { flex: 1; }
  .tog .sub { margin: 0; }
  .tog input { position: absolute; opacity: 0; pointer-events: none; }
  .sw { width: 44px; height: 26px; border-radius: 13px; background: var(--line-2); position: relative; flex: none; transition: background .15s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
  .tog input:checked + .sw { background: var(--bad); }
  .tog input:checked + .sw::after { transform: translateX(18px); }
  .tog input:focus-visible + .sw { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sheet .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .sheet .row .ghost { flex: 1 1 100px; }
  @media (prefers-reduced-motion: reduce) { .screen.in { animation: none; } }
</style>
</head>
<body>
<div class="stage">
  <aside class="caption">
    <p class="eyebrow">Customer app · powered by Boomi</p>
    <div class="pseg" role="group" aria-label="Customer" data-pseg></div>
    <h1 id="capH">Mia's Boomi Bank app</h1>
    <p id="capP"></p>
    <ul id="capL"></ul>
    <div class="links">
      <a class="btn" href="onboarding.html" data-route="/onboarding">Act 1 · Onboarding pipeline</a>
      <a class="btn" href="rm-desk.html" data-route="/rm-desk" target="_blank" rel="noopener">RM desk</a>
    </div>
  </aside>

  <div class="phone">
    <div class="app" id="app">
      <header class="apphead">
        <div class="brandmark"><span class="mark" aria-hidden="true">BB</span>Boomi Bank</div>
        <span class="sp"></span>
        <span id="bbAuthSlot"></span>
        <button class="gear" id="gear" type="button" aria-label="Presenter controls" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </header>
      <main class="screens" id="screens">
        <section class="screen" id="sWelcome" aria-label="Home"></section>
        <section class="screen" id="sProgress" hidden aria-label="Working">
          <div class="progress" aria-live="polite">
            <div class="orb" aria-hidden="true"><span></span><span></span><span></span><i></i></div>
            <div class="rot" id="rot">Working…</div>
            <p class="sub" id="progSub"></p>
            <div class="elapsed" id="elapsed">0 s</div>
          </div>
        </section>
        <section class="screen" id="sDone" hidden aria-label="Done"></section>
        <section class="screen" id="sFailed" hidden aria-label="Not completed"></section>
      </main>
      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetH">
        <div class="grab" aria-hidden="true"></div>
        <h2 id="sheetH">Presenter controls</h2>
        <p class="sub">Customer</p>
        <div class="pseg" role="group" aria-label="Customer" data-pseg></div>
        <p class="sub">Simulated failures are sent to Boomi as request flags.</p>
        <label class="tog"><span class="txt">Screening service offline<p class="sub">simulate_screening_down (Mia)</p></span><input type="checkbox" id="tScreen"><span class="sw" aria-hidden="true"></span></label>
        <label class="tog"><span class="txt">ID document mismatch<p class="sub">simulate_id_mismatch (Mia)</p></span><input type="checkbox" id="tId"><span class="sw" aria-hidden="true"></span></label>
        <label class="tog"><span class="txt">Payment failed<p class="sub">simulate_payment_failed (Olivia)</p></span><input type="checkbox" id="tPay"><span class="sw" aria-hidden="true"></span></label>
        <div class="row">
          <button class="ghost solid" id="restart" type="button">Restart</button>
          <button class="ghost" id="theme" type="button">Dark mode</button>
          <button class="ghost" id="closeSheet" type="button">Close</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="mock-bundle.js"></script>
<script src="common.js"></script>
<script src="config.js"></script>
<script src="online.js"></script>
<script>
(function () {
  "use strict";
  var BB = window.BB, esc = BB.esc, M = window.BB_MOCK || {};
  var $ = function (id) { return document.getElementById(id); };
  BB.initTheme($("theme"));
  BB.routes();

  /* Persona toggle (caption + gear menu): Mia (onboarding) or Olivia (loan payout). Remembered for the RM desk (bb.persona). */
  var PERSONAS = {

      '<p class="small muted" style="margin:8px 0 0">Registry events run through BB_P7_Security_Release_Status.</p>';
    var n = $("relNext"), a = $("relAuto");
    if (n) n.addEventListener("click", function () { postRelease(); });
    if (a) a.addEventListener("click", autoRelease);
  }
  function postRelease() {
    var r = state.rel;
    if (r.busy || r.stage >= 3) return Promise.resolve();
    r.busy = true; renderRelease();
    var st = REL[r.stage][0], my = state.runId;
    return BB.product("release", { security_id: r.sid, status: st }).then(function (res) {
      if (my !== state.runId) return;
      r.busy = false; r.last = res.data || {};
      if (r.last.status !== "REJECTED") r.stage++;
      renderRelease();
    });
  }
  function autoRelease() {
    var go = function () { if (state.rel.stage >= 3 || !$("relCard")) return; postRelease().then(function () { setTimeout(go, 900); }); };
    go();
  }
  function renderHeld(d) {
    var sm = d.summary || {}, pay = d.payment || {};
    $("sFailed").innerHTML = '<div class="failed"><div class="ic" aria-hidden="true">!</div><h1>' + (d.holdReason === "PAYMENT_FAILED" ? "Your payment didn't go through" : "Your payout is on hold") + "</h1>" +
      "<p>" + (d.holdReason === "PAYMENT_FAILED" ? "The transfer of " + esc(BB.dollars(pay.amount)) + " was rejected, so nothing has been closed and your loans are unchanged. Your banker will be in touch." :
        esc((sm.warnings || [])[0] || "We need a quick check before money moves.")) + "</p>" +
      ((sm.nextActions || []).length ? '<div class="err">' + sm.nextActions.map(esc).join("<br>") + "</div>" : "") +
      '<div class="btnrow" style="justify-content:center"><button class="ghost solid" type="button" id="callRm">Call my banker</button><button class="ghost" type="button" id="tryAgain">Back</button></div>' +
      '<div class="src" style="justify-content:center;gap:10px"><span>BB_P6 · ' + esc(d.status) + " · " + esc(d.holdReason || "") + "</span>" + BB.srcBadge(d) + "</div></div>" + whatHappened(d, "BB_P6_Loan_Payout_Closure_Orchestration");
    show("sFailed");
    $("tryAgain").addEventListener("click", restart);
    $("callRm").addEventListener("click", function () { this.textContent = "Sarah Mitchell will call you back today"; this.disabled = true; });
  }
  function renderFailed(d, title, text) {
    $("sFailed").innerHTML = '<div class="failed"><div class="ic" aria-hidden="true">!</div><h1>' + esc(title) + "</h1><p>" + esc(text) + "</p>" +
      (d && d.error ? '<div class="err">' + esc(d.error) + "</div>" : "") +
      '<div class="btnrow" style="justify-content:center"><button class="ghost" type="button" id="tryAgain">Back</button></div>' +
      (d && d._servedBy ? '<div class="src" style="justify-content:center;gap:10px"><span>' + esc(d.status || "") + "</span>" + BB.srcBadge(d) + "</div>" : "") + "</div>";
    show("sFailed");
    $("tryAgain").addEventListener("click", restart);
  }

  /* =============== shell =============== */
  function renderHome() { if (CIF === "CIF-100204") renderMiaWelcome(); else renderOliviaWelcome(); show("sWelcome"); }
  function restart() { state.runId++; state.busy = false; stopWaiting(); renderHome(); }
  function sheet(open) { $("app").classList.toggle("open", open); }
  $("gear").addEventListener("click", function () { sheet(true); });
  $("scrim").addEventListener("click", function () { sheet(false); });
  $("closeSheet").addEventListener("click", function () { sheet(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") sheet(false); });
  $("tScreen").addEventListener("change", function () { state.screenDown = this.checked; });
  $("tId").addEventListener("change", function () { state.idMismatch = this.checked; });
  $("tPay").addEventListener("change", function () { state.payFailed = this.checked; });
  $("restart").addEventListener("click", function () { sheet(false); restart(); });
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-pseg] button");
    if (!b || b.dataset.p === CIF) return;
    setPersona(b.dataset.p); restart();
  });

  /* presenter params (no persona in the URL): ?autorun=1&screening=down&id=mismatch&payment=failed&release=1&what=open */
  var qp = {}; try { new URLSearchParams(location.search).forEach(function (v, k) { qp[k] = v; }); } catch (e) {}
  if (/^(down|off)/i.test(qp.screening || "")) { state.screenDown = true; $("tScreen").checked = true; }
  if (/^mis/i.test(qp.id || "")) { state.idMismatch = true; $("tId").checked = true; }
  if (/^fail/i.test(qp.payment || "")) { state.payFailed = true; $("tPay").checked = true; }
  state.whatOpen = /^(1|open|true)$/i.test(qp.what || "");
  state.autoRelease = /^(1|true|yes)$/i.test(qp.release || "");
  renderHome();
  if (qp.autorun) setTimeout(function () { if (CIF === "CIF-100204") runOnboarding(); else runPayout(); }, 900);
})();
</script>
</body>
</html>
