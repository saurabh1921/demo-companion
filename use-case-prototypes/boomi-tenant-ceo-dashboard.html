<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEO Dashboard · Boomi Integrations</title>
<style>
  :root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --text: #0f172a;
    --text-muted: #64748b;
    --text-light: #94a3b8;
    --primary: #1e40af;
    --primary-light: #3b82f6;
    --primary-soft: #dbeafe;
    --success: #16a34a;
    --success-soft: #dcfce7;
    --warning: #f59e0b;
    --warning-soft: #fef3c7;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --info: #0891b2;
    --info-soft: #cffafe;
    --neutral: #94a3b8;
    --neutral-soft: #f1f5f9;
    --border: #e2e8f0;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 8px rgba(0,0,0,0.06), 0 2px 4px rgba(0,0,0,0.04);
    --shadow-hover: 0 10px 20px rgba(30,64,175,0.12), 0 4px 8px rgba(0,0,0,0.06);
    --nav-h: 56px;
    --sub-h: 44px;
    --gap: 14px;
    --pad: 16px;
    --injected-nav-h: 0px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
    margin: 0;
    font-size: 14px;
  }

  /* Top Navigation */
  nav.topnav {
    position: sticky;
    top: var(--injected-nav-h);
    height: var(--nav-h);
    background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #3b82f6 100%);
    color: white;
    display: flex;
    align-items: center;
    padding: 0 24px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    z-index: 100;
    gap: 18px;
  }
  nav.topnav .logo {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.4px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-right: 14px;
  }
  nav.topnav .logo .badge-live {
    background: rgba(255,255,255,0.15);
    font-size: 9px;
    padding: 3px 7px;
    border-radius: 4px;
    letter-spacing: 0.6px;
    font-weight: 700;
    text-transform: uppercase;
  }
  nav.topnav .nav-links {
    display: flex;
    gap: 4px;
    flex: 1;
    flex-wrap: wrap;
  }
  nav.topnav .nav-link {
    color: rgba(255,255,255,0.78);
    text-decoration: none;
    padding: 7px 13px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s;
    cursor: pointer;
  }
  nav.topnav .nav-link:hover { background: rgba(255,255,255,0.12); color: white; }
  nav.topnav .nav-link.active { background: rgba(255,255,255,0.18); color: white; }
  nav.topnav .meta {
    font-size: 11px;
    color: rgba(255,255,255,0.7);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  nav.topnav .meta .pulse {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #4ade80;
    animation: pulse 2s infinite;
    box-shadow: 0 0 0 0 rgba(74,222,128,0.6);
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(74,222,128,0.6); }
    70% { box-shadow: 0 0 0 8px rgba(74,222,128,0); }
    100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
  }

  /* Sub-bar (breadcrumb / context) */
  .sub-bar {
    position: sticky;
    top: calc(var(--injected-nav-h) + var(--nav-h));
    height: var(--sub-h);
    background: white;
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    z-index: 99;
  }
  .sub-bar .breadcrumb {
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sub-bar .breadcrumb a { color: var(--primary); text-decoration: none; font-weight: 500; cursor: pointer; }
  .sub-bar .breadcrumb a:hover { text-decoration: underline; }
  .sub-bar .breadcrumb .arrow { color: var(--text-light); }
  .sub-bar .breadcrumb .current { color: var(--text); font-weight: 600; }
  .sub-bar .actions { display: flex; gap: 8px; }
  .sub-bar .btn {
    padding: 5px 12px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    background: white;
    color: var(--text-muted);
    transition: all 0.15s;
  }
  .sub-bar .btn:hover { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }
  .sub-bar .btn.primary { background: var(--primary); color: white; border-color: var(--primary); }

  /* App container */
  #app {
    height: calc(100vh - var(--nav-h) - var(--sub-h) - var(--injected-nav-h));
    overflow: hidden;
  }

  /* Dashboard - fits exactly in viewport */
  .dashboard {
    height: 100%;
    padding: var(--pad);
    display: grid;
    grid-template-rows: auto 1fr 1fr;
    gap: var(--gap);
  }

  /* KPI row */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: var(--gap);
  }
  .kpi {
    background: var(--card);
    border-radius: 10px;
    padding: 12px 16px;
    box-shadow: var(--shadow);
    border-left: 4px solid var(--primary);
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .kpi:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
  .kpi::after {
    content: '↗';
    position: absolute;
    top: 10px; right: 12px;
    color: var(--text-light);
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .kpi:hover::after { opacity: 1; }
  .kpi .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-muted);
    font-weight: 700;
    margin-bottom: 3px;
  }
  .kpi .value { font-size: 24px; font-weight: 800; color: var(--text); line-height: 1.1; }
  .kpi .delta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .kpi.success { border-left-color: var(--success); }
  .kpi.success .value { color: var(--success); }
  .kpi.warning { border-left-color: var(--warning); }
  .kpi.warning .value { color: var(--warning); }
  .kpi.danger { border-left-color: var(--danger); }
  .kpi.danger .value { color: var(--danger); }
  .kpi.info { border-left-color: var(--info); }
  .kpi.info .value { color: var(--info); }

  /* Widget rows */
  .widget-row {
    display: grid;
    gap: var(--gap);
    min-height: 0;
  }
  .row-2 { grid-template-columns: 1.5fr 1fr 1fr; }
  .row-3 { grid-template-columns: 1fr 1fr 1fr; }

  .widget {
    background: var(--card);
    border-radius: 10px;
    padding: 14px 18px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .widget:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
  .widget-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    flex-shrink: 0;
  }
  .widget-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .widget-link {
    font-size: 11px;
    color: var(--primary);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .widget-body { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }

  /* Bar chart */
  .mini-bars { display: flex; flex-direction: column; gap: 6px; }
  .mini-bar-row {
    display: grid;
    grid-template-columns: 1fr 90px;
    gap: 8px;
    align-items: center;
    font-size: 12px;
  }
  .mini-bar-label {
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    transition: color 0.15s;
  }
  .mini-bar-row:hover .mini-bar-label { color: var(--primary); font-weight: 600; }
  .mini-bar-track-wrap { position: relative; }
  .mini-bar-track {
    background: #eef2f7;
    height: 18px;
    border-radius: 3px;
    position: relative;
    overflow: hidden;
  }
  .mini-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary-light), var(--primary));
    border-radius: 3px;
    transition: width 0.6s ease-out;
  }
  .mini-bar-fill.warn { background: linear-gradient(90deg, #fbbf24, var(--warning)); }
  .mini-bar-fill.danger { background: linear-gradient(90deg, #f87171, var(--danger)); }
  .mini-bar-fill.success { background: linear-gradient(90deg, #4ade80, var(--success)); }
  .mini-bar-value {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    font-weight: 700;
    color: var(--text);
    z-index: 1;
  }

  /* Donut */
  .donut-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    min-height: 0;
  }
  .donut-wrap svg { flex-shrink: 0; width: 110px; height: 110px; }
  .donut-legend { flex: 1; font-size: 12px; }
  .donut-legend .item { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .donut-legend .swatch { width: 10px; height: 10px; border-radius: 2px; }
  .donut-legend .label { color: var(--text); font-weight: 500; }
  .donut-legend .val { color: var(--text-muted); margin-left: auto; }

  /* Health grid */
  .health-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    flex: 1;
    min-height: 0;
  }
  .health-tile {
    padding: 10px 12px;
    border-radius: 8px;
    border-left: 4px solid;
    display: flex;
    flex-direction: column;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .health-tile:hover { transform: scale(1.03); }
  .health-tile.h { background: var(--success-soft); border-left-color: var(--success); }
  .health-tile.a { background: var(--warning-soft); border-left-color: var(--warning); }
  .health-tile.c { background: var(--danger-soft); border-left-color: var(--danger); }
  .health-tile.d { background: var(--neutral-soft); border-left-color: var(--neutral); }
  .health-tile .count { font-size: 22px; font-weight: 800; line-height: 1; }
  .health-tile.h .count { color: var(--success); }
  .health-tile.a .count { color: var(--warning); }
  .health-tile.c .count { color: var(--danger); }
  .health-tile.d .count { color: var(--neutral); }
  .health-tile .lbl { font-size: 11px; color: var(--text); font-weight: 600; margin-top: 3px; }
  .health-tile .sub { font-size: 10px; color: var(--text-muted); }

  /* Process list widget */
  .proc-list { display: flex; flex-direction: column; gap: 4px; flex: 1; min-height: 0; overflow: auto; }
  .proc-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    transition: background 0.15s;
    align-items: center;
  }
  .proc-row:hover { background: var(--primary-soft); }
  .proc-row .pname { font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proc-row .pruns { font-weight: 600; color: var(--text-muted); font-size: 11px; }
  .proc-row .pdot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .pdot.healthy { background: var(--success); }
  .pdot.attention { background: var(--warning); }
  .pdot.critical { background: var(--danger); animation: pulse-red 1.5s infinite; }
  .pdot.dormant { background: var(--neutral); }
  @keyframes pulse-red {
    0% { box-shadow: 0 0 0 0 rgba(220,38,38,0.5); }
    70% { box-shadow: 0 0 0 6px rgba(220,38,38,0); }
    100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); }
  }

  /* Critical alert widget */
  .alert-widget {
    background: linear-gradient(135deg, #fef2f2 0%, #fff 100%);
    border: 1px solid var(--danger-soft);
    border-left: 5px solid var(--danger);
  }
  .alert-widget .widget-title { color: var(--danger); }
  .alert-content { flex: 1; min-height: 0; overflow: auto; }
  .alert-item { padding: 8px 10px; background: white; border-radius: 6px; margin-bottom: 6px; border: 1px solid var(--danger-soft); cursor: pointer; }
  .alert-item:hover { background: var(--danger-soft); }
  .alert-item .at { font-size: 12px; font-weight: 700; color: var(--danger); }
  .alert-item .am { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  /* Detail page layouts (scrollable) */
  .detail-page {
    height: 100%;
    overflow-y: auto;
    padding: 22px 28px;
  }
  .detail-page h2 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
  }
  .detail-page .lead { color: var(--text-muted); margin: 0 0 20px; font-size: 14px; }

  .card {
    background: white;
    border-radius: 10px;
    padding: 20px 24px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .card h3 { margin: 0 0 14px; font-size: 16px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 10px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th { background: #f8fafc; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--primary-soft); }
  td code { background: var(--neutral-soft); padding: 2px 6px; border-radius: 3px; font-size: 12px; font-family: "SF Mono", Monaco, Consolas, monospace; }

  .badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    white-space: nowrap;
  }
  .badge.healthy { background: var(--success-soft); color: #14532d; }
  .badge.attention { background: var(--warning-soft); color: #78350f; }
  .badge.critical { background: var(--danger-soft); color: #7f1d1d; }
  .badge.dormant { background: var(--neutral-soft); color: var(--text-muted); }
  .badge.info { background: var(--info-soft); color: #155e75; }
  .badge.p0 { background: var(--danger); color: white; }
  .badge.p1 { background: var(--warning); color: white; }
  .badge.p2 { background: var(--success); color: white; }
  .badge.p3 { background: var(--neutral); color: white; }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .stat {
    background: white;
    padding: 14px 16px;
    border-radius: 8px;
    box-shadow: var(--shadow-sm);
    border-left: 3px solid var(--primary);
  }
  .stat .l { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 700; }
  .stat .v { font-size: 22px; font-weight: 800; margin-top: 2px; }
  .stat.ok { border-left-color: var(--success); }
  .stat.ok .v { color: var(--success); }
  .stat.err { border-left-color: var(--danger); }
  .stat.err .v { color: var(--danger); }
  .stat.warn { border-left-color: var(--warning); }
  .stat.warn .v { color: var(--warning); }

  pre {
    background: #1e293b;
    color: #e2e8f0;
    padding: 12px 16px;
    border-radius: 6px;
    font-family: "SF Mono", Monaco, Consolas, monospace;
    font-size: 12px;
    line-height: 1.5;
    overflow-x: auto;
  }

  .callout {
    padding: 12px 16px;
    border-radius: 8px;
    border-left: 4px solid;
    margin: 12px 0;
    font-size: 13px;
  }
  .callout.info { background: var(--primary-soft); border-left-color: var(--primary); }
  .callout.warn { background: var(--warning-soft); border-left-color: var(--warning); }
  .callout.danger { background: var(--danger-soft); border-left-color: var(--danger); }
  .callout.success { background: var(--success-soft); border-left-color: var(--success); }

  /* Fade-in animation */
  .fade-in {
    animation: fadeIn 0.3s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Scrollbar styling for detail pages */
  .detail-page::-webkit-scrollbar, .proc-list::-webkit-scrollbar, .alert-content::-webkit-scrollbar { width: 8px; height: 8px; }
  .detail-page::-webkit-scrollbar-thumb, .proc-list::-webkit-scrollbar-thumb, .alert-content::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

  /* Filter input */
  .filter-input {
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    width: 240px;
    background: white;
  }
  .filter-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }

  /* Responsive */
  @media (max-width: 1100px) {
    .kpi-row { grid-template-columns: repeat(3, 1fr); }
    .row-2, .row-3 { grid-template-columns: 1fr 1fr; }
    html, body { overflow: auto; }
    .dashboard { height: auto; min-height: calc(100vh - var(--nav-h) - var(--sub-h)); }
    #app { height: auto; }
  }
  @media (max-width: 700px) {
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .row-2, .row-3 { grid-template-columns: 1fr; }
    nav.topnav .meta { display: none; }
  }
</style>
</head>

    const fmtAge = ageHours < 1 ? `${Math.floor(ageMs / 60000)} min ago` :

                   `${Math.floor(ageHours / 24)} days ago`;
    const isStale = ageHours > 26;  // 26h grace for daily refresh
    statusEl.textContent = `Live · refreshed ${fmtAge}`;
    statusEl.title = `Generated at ${DATA.generatedAt}`;
    if (isStale) {
      statusEl.textContent = `⚠️ Stale · last refresh ${fmtAge}`;

function router() {
  const hash = location.hash || '#/';
  const [path, queryStr] = hash.split('?');
  const params = {};
  if (queryStr) queryStr.split('&').forEach(p => { const [k,v] = p.split('='); params[k] = decodeURIComponent(v); });

  let view = '';
  let crumbs = [{ label: 'Home', route: '#/' }];
  let activeNav = '#/';

  if (path === '#/' || path === '') {
    view = Views.dashboard();
    crumbs = [{ label: 'CEO Dashboard', route: '#/' }];
  } else if (path === '#/deployments') {
    view = Views.deployments(params);
    crumbs.push({ label: 'Deployments', route: '#/deployments' });
    activeNav = '#/deployments';
  } else if (path.startsWith('#/process/')) {
    const id = path.replace('#/process/', '');
    view = Views.process(id);
    crumbs.push({ label: 'Processes', route: '#/processes' });
    const p = DATA.processStats[id];
    crumbs.push({ label: p ? p.name : 'Detail', route: path });
    activeNav = '#/processes';
  } else if (path === '#/processes') {
    view = Views.processes();
    crumbs.push({ label: 'Processes', route: '#/processes' });
    activeNav = '#/processes';
  } else if (path === '#/errors') {
    view = Views.errors();
    crumbs.push({ label: 'Errors', route: '#/errors' });
    activeNav = '#/errors';
  } else if (path === '#/discards') {
    view = Views.discards();
    crumbs.push({ label: 'Discards', route: '#/discards' });
    activeNav = '#/discards';
  } else if (path === '#/dormant') {
    view = Views.dormant();
    crumbs.push({ label: 'Dormant', route: '#/dormant' });
    activeNav = '#/dormant';
  } else if (path === '#/recommendations') {
    view = Views.recommendations();
    crumbs.push({ label: 'Actions', route: '#/recommendations' });
    activeNav = '#/recommendations';
  } else if (path === '#/executions') {
    view = Views.executions();
    crumbs.push({ label: 'Executions', route: '#/executions' });
    activeNav = '#/executions';
  } else if (path === '#/about') {
    view = Views.about();
    crumbs.push({ label: 'About', route: '#/about' });
    activeNav = '#/about';
  } else if (path === '#/docs') {
    view = Views.docs();
    crumbs.push({ label: 'Docs', route: '#/docs' });
    activeNav = '#/docs';
  } else {
    view = `<div class="detail-page fade-in"><h2>404</h2><p class="lead">Page not found. <a onclick="nav('#/')" style="cursor:pointer;color:var(--primary);">Go home →</a></p></div>`;
  }

  document.getElementById('app').innerHTML = view;
  setBreadcrumb(crumbs);
  updateNav(activeNav);
  window.scrollTo(0, 0);
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = event.target.textContent;
    event.target.textContent = '✓ Copied!';
    setTimeout(() => event.target.textContent = orig, 1500);
  });
}

// Wire up nav clicks
document.querySelectorAll('.nav-link').forEach(el => {
  el.addEventListener('click', (e) => { e.preventDefault(); nav(el.dataset.route); });
});

window.addEventListener('hashchange', router);
router();
</script>
