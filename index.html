<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SE Demo Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
:root{
  --navy:#072B55; --coral:#FF7C66; --purple:#A03291; --gray:#EDEDED;
  --white:#FFFFFF; --blue:#0085F0; --green:#0EC38B;
  --grad:linear-gradient(90deg,#FF7C66 0%,#A03291 100%);
  --bg:#EDEDED; --surface:#FFFFFF; --text:#000000; --text-dim:rgba(7,43,85,.62);
  --chip:rgba(7,43,85,.05); --border:rgba(7,43,85,.10);
  --shadow:0 1px 2px rgba(7,43,85,.06),0 8px 24px rgba(7,43,85,.07);
  --radius:14px;
}
[data-theme="dark"]{
  --bg:#041C38; --surface:#0A2F5A; --text:#FFFFFF; --text-dim:rgba(255,255,255,.66);
  --chip:rgba(255,255,255,.07); --border:rgba(255,255,255,.14);
  --shadow:0 8px 28px rgba(0,0,0,.38);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Poppins',Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-weight:300; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-weight:500; letter-spacing:-.02em; margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* header — the portal's ONE heading. The prototypes carry a second, separate
   nav bar (scripts/inject-nav.mjs) because there it is the only way back here;
   the portal deliberately has no copy of it, because the grid below IS the
   list of use cases and a second "SE Demo Companion" wordmark above this one
   was just a duplicate heading. */
.hdr{background:var(--navy);color:#fff;padding:22px 0 0}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-size:20px;font-weight:500;letter-spacing:-.02em}
.brand span{font-weight:300;opacity:.72}
.hdr-sub{font-size:13px;opacity:.72;margin-top:4px;padding-bottom:18px}
.accent{height:4px;background:var(--grad)}
.tbtn{
  background:transparent;border:1px solid rgba(255,255,255,.28);color:#fff;
  border-radius:999px;padding:7px 14px;font:inherit;font-size:12px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;
}
.tbtn:hover{background:rgba(255,255,255,.10)}

/* .stat-n / .stat-l are the detail overlay's impact figures. They were once
   shared with a hero rollup band at the top of the page; that band is gone
   (no aggregate figures anywhere), so these now belong to .sheet-stats alone. */
.stat-n{font-size:38px;font-weight:500;color:var(--coral);letter-spacing:-.03em;line-height:1}
.stat-l{font-size:12px;color:var(--text-dim);margin-top:6px}

/* layout */
#controls{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--border);padding:8px 0}
#grid{padding:22px 0 48px}

.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;cursor:pointer;text-align:left;
  padding:0;font:inherit;color:inherit;display:flex;flex-direction:column;
  transition:transform .14s ease,box-shadow .14s ease;
}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(7,43,85,.14)}
.card:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.card-strip{height:44px;background:var(--grad);display:flex;align-items:center;padding:0 16px}
.card-init{font-size:13px;font-weight:600;color:#fff;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.card-body{padding:16px;display:flex;flex-direction:column;gap:9px;flex:1}
.eyebrow{font-size:11px;font-weight:600;color:var(--coral);letter-spacing:.01em}
.card-title{font-size:17px;font-weight:500;letter-spacing:-.02em}
.card-cust{font-size:13px;color:var(--text-dim)}
/* Attribution, not a headline: coral-family brand colour and an icon make it
   easy to find, but it is 11.5px against the title's 17px and sits below the
   customer, so it cannot compete with either. */
.card-auth{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;
  color:var(--purple);letter-spacing:.01em}
.card-auth i{font-size:13px}
[data-theme="dark"] .card-auth{color:var(--coral)}
.card-sum{font-size:13px;color:var(--text-dim)}
.impact{display:flex;align-items:baseline;gap:7px;margin-top:2px}
.impact-n{font-size:26px;font-weight:500;color:var(--coral);letter-spacing:-.02em;line-height:1}
.impact-u{font-size:12px;color:var(--text-dim)}
.impact-tbd{font-size:12px;color:var(--text-dim);font-style:normal;opacity:.75}
/* An estimated figure is deliberately subordinate to a sourced one: never coral,
   smaller, muted, and always prefixed "Est." so it cannot read as a measured fact. */
.impact-est{font-size:12.5px;font-weight:500;color:var(--text-dim);margin-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.chip{background:var(--chip);border:1px solid var(--border);border-radius:999px;
  padding:3px 10px;font-size:11px;color:var(--text-dim)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600}
.badge.published{color:var(--green)}
.badge.local{color:var(--blue)}
.badge.pending{color:var(--text-dim)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.more{display:block;margin:26px auto 0;background:var(--navy);color:#fff;border:0;
  border-radius:999px;padding:11px 26px;font:inherit;font-size:13px;cursor:pointer}
[data-theme="dark"] .more{background:var(--grad)}
.empty{text-align:center;color:var(--text-dim);padding:56px 0;font-size:14px}
/* ONE LINE, at every width. The row never wraps: below the width where ten
   controls genuinely fit, it scrolls horizontally instead, and the search box
   is sticky at the start of that scroll port so it can never scroll out of
   reach - the original defect this bar exists to fix. */
.ctl-row{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;padding-bottom:1px}
.search{position:sticky;left:0;z-index:2;flex:1 1 170px;min-width:150px;
  background:var(--bg);padding-right:2px}
.search i{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--text-dim);font-size:14px;pointer-events:none}
.search input{
  width:100%;padding:6px 12px 6px 30px;border-radius:999px;font:inherit;font-size:12.5px;
  border:1px solid var(--border);background:var(--surface);color:var(--text)}
.search input:focus{outline:2px solid var(--coral);outline-offset:1px;border-color:transparent}
/* Fixed, compact basis so the dropdowns never fight the flexing search box.
   A long chosen value ("Platform operations") ellipsises rather than widening
   the control - the full value is readable in the open list and in the result
   set, so nothing is lost and the row cannot be blown apart by the data. */
.ctl-row select{flex:0 0 auto;width:88px;padding:6px 8px;border-radius:999px;
  font:inherit;font-size:12px;line-height:1.15;border:1px solid var(--border);
  background:var(--surface);color:var(--text);cursor:pointer;text-overflow:ellipsis}
#sort{width:128px}
#count{font-size:12px;color:var(--text-dim);white-space:nowrap;flex:0 0 auto}
#clear{flex:0 0 auto}
#clear{background:none;border:0;color:var(--purple);font:inherit;font-size:12.5px;
  cursor:pointer;text-decoration:underline;white-space:nowrap}
[data-theme="dark"] #clear{color:var(--coral)}
@media (max-width:480px){
  .ctl-row{gap:5px}
  .ctl-row select{font-size:11px;padding:5px 7px;width:82px}
  #sort{width:118px}
}
/* The result count is the most droppable control, so it is the first thing to
   go when ten controls stop fitting one line. It is redundant anyway - the
   grid below shows what matched. */
@media (max-width:1099px){
  #count{display:none}
}
#overlay[hidden]{display:none}
#overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-start;
  justify-content:center;padding:36px 18px;overflow:auto;background:rgba(7,43,85,.52)}
.sheet{background:var(--surface);color:var(--text);border-radius:var(--radius);
  width:min(720px,100%);box-shadow:0 24px 60px rgba(0,0,0,.30);overflow:hidden}
.sheet-strip{height:6px;background:var(--grad)}
.sheet-in{padding:26px 28px 30px}
.sheet-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.sheet h2{font-size:26px;letter-spacing:-.03em;margin:6px 0 2px}
.sheet-cust{font-size:14px;color:var(--text-dim)}
.sheet-auth{font-size:12.5px;font-weight:500;color:var(--purple);margin-top:5px}
[data-theme="dark"] .sheet-auth{color:var(--coral)}
.xbtn{background:var(--chip);border:1px solid var(--border);border-radius:50%;
  width:34px;height:34px;cursor:pointer;color:var(--text);font-size:16px;flex:none}
.xbtn:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.sheet-stats{display:flex;gap:40px;margin:20px 0 4px;flex-wrap:wrap}
.sheet-stats .stat-n.est{font-size:24px;color:var(--text-dim)}
.stat-b{font-size:11px;color:var(--text-dim);margin-top:5px}
.sec p.workings{color:var(--text-dim)}
.sec{margin-top:22px}
.sec h3{font-size:11px;font-weight:600;color:var(--text-dim);margin-bottom:8px}
.sec p{margin:0;font-size:14px}
.sec ul{margin:0;padding-left:18px;font-size:14px}
.sec ol{margin:0;padding-left:20px;font-size:14px}
.sec li{margin-bottom:4px}
.sec ol li{margin-bottom:7px}
.lead{margin:20px 0 0;font-size:15px;line-height:1.62}
.lead + .lead{margin-top:12px}
/* Adjacent systems are NOT what the demo integrates. Dashed and hollow so the
   difference from the solid `systems` chips is visible before the label is
   read; the label says it too. */
.chip.adj{background:transparent;border-style:dashed;font-style:normal}
/* The costing model. Boxed, tabular and selectable, because an SE puts the
   customer's own numbers into it live in the room. */
.model{border:1px solid var(--border);border-radius:var(--radius);
  background:var(--chip);padding:16px 16px 14px}
.model h3{color:var(--coral);font-size:12px;margin-bottom:6px}
.model p.model-warn{font-size:12.5px;color:var(--text-dim);margin:0 0 11px}
.model p.model-unit{font-size:13px;margin:0 0 12px}
.model-t{width:100%;border-collapse:collapse;font-size:13px}
.model-t th{text-align:left;font-weight:600;font-size:11px;color:var(--text-dim);
  padding:0 10px 6px 0;border-bottom:1px solid var(--border)}
.model-t td{padding:7px 10px 7px 0;border-bottom:1px solid var(--border);vertical-align:top}
.model-t tr:last-child td{border-bottom:0}
.model-t td.ph{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  white-space:nowrap;font-weight:500}
.model p.model-ex{font-size:13px;margin:13px 0 0;line-height:1.6}
.model-ex-l{display:block;font-size:11px;font-weight:600;color:var(--text-dim);margin-bottom:4px}
.rel{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.rel a{font-size:13.5px;color:var(--purple);text-decoration:none;
  display:inline-flex;align-items:center;gap:7px}
.rel a:hover{text-decoration:underline}
[data-theme="dark"] .rel a{color:var(--coral)}
.runfrom{margin-top:26px;padding-top:14px;border-top:1px solid var(--border)}
.runfrom .lbl{display:block;font-size:11px;font-weight:600;color:var(--text-dim);
  margin-bottom:5px}
.runfrom code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12px;color:var(--text-dim);word-break:break-all}
.open-btn{display:inline-flex;align-items:center;gap:9px;margin-top:26px;
  background:var(--grad);color:#fff;border:0;border-radius:999px;
  padding:13px 26px;font:inherit;font-size:14px;font-weight:500;
  cursor:pointer;text-decoration:none}
.soon{display:inline-flex;align-items:center;gap:9px;margin-top:26px;
  background:var(--chip);border:1px dashed var(--border);color:var(--text-dim);
  border-radius:999px;padding:13px 26px;font-size:14px}
</style>
</head>
<body>

<header class="hdr">
  <div class="wrap">
    <div class="hdr-row">
      <div>
        <div class="brand">SE Demo Companion</div>
      </div>
      <button class="tbtn" id="theme-toggle" type="button" aria-label="Switch to dark theme">
        <i class="ph ph-moon" aria-hidden="true"></i><span id="theme-label">Dark</span>
      </button>
    </div>
    <div class="hdr-sub">Prototypes built by Solution Engineers. Search by industry, system, partner, author, or the conversation it fits.</div>
  </div>
  <div class="accent"></div>
</header>

<div id="controls"><div class="wrap"></div></div>
<main id="grid"><div class="wrap"></div></main>
<div id="overlay" hidden></div>

<script>
/* PURE:START */
// The costing model is searchable like everything else - an SE hunting
// "cost per invoice" or "tickets deflected" is looking for exactly this.
function modelBlob(mo){
  if(!mo) return '';
  return [mo.unit || '', mo.example || '',
    (mo.inputs||[]).map(function(i){ return (i.name||'') + ' ' + (i.source||''); }).join(' ')
  ].join(' ');
}
// Every prose and vocabulary field on the entry, author included, so the one
// free-text box reaches all 23 keys' worth of content and not a subset.
function searchBlob(uc){
  return [
    uc.title, uc.customer, uc.industry, uc.author, uc.summary, uc.narrative,
    uc.partnersNote, uc.misc, uc.originalPath,
    (uc.partners||[]).join(' '), (uc.systems||[]).join(' '),
    (uc.adjacentSystems||[]).join(' '),
    (uc.products||[]).join(' '), (uc.conversations||[]).join(' '),
    (uc.demoFlow||[]).join(' '),
    (uc.relatedPages||[]).map(function(p){ return p.label || ''; }).join(' '),
    (uc.tags||[]).join(' '),
    (uc.impact && uc.impact.note) || '',
    modelBlob(uc.impactModel)
  ].join(' ').toLowerCase();
}
function matchesQuery(uc, query){
  var q = (query||'').trim().toLowerCase();
  if(!q) return true;
  return searchBlob(uc).indexOf(q) !== -1;
}
// Status answers the question an SE actually has: can I send this link to
// someone, or is it only on my machine? 'published' = a real https:// URL
// (e.g. Google Sites); 'local' = a relative path that only resolves from
// this machine's disk (every entry, today, thanks to Task 8); 'pending' =
// no url at all yet.
function deriveStatus(uc){
  var url = uc.url || '';
  if(!url) return 'pending';
  return /^https:\/\//.test(url) ? 'published' : 'local';
}
function matchesFilters(uc, filters){
  var f = filters || {};
  function facet(sel, vals){
    if(!sel || !sel.length) return true;
    for(var i=0;i<sel.length;i++){ if(vals.indexOf(sel[i]) !== -1) return true; }
    return false;
  }
  return facet(f.industry, [uc.industry])
      && facet(f.systems,  uc.systems  || [])
      && facet(f.partners, uc.partners || [])
      && facet(f.products, uc.products || [])
      && facet(f.author,   [uc.author])
      && facet(f.status,   [deriveStatus(uc)]);
}
function deriveFacets(list){
  var out = {industry:[],systems:[],partners:[],products:[],author:[],status:[]};
  function push(key, v){ if(v && out[key].indexOf(v) === -1) out[key].push(v); }
  (list||[]).forEach(function(uc){
    push('industry', uc.industry);
    (uc.systems ||[]).forEach(function(v){ push('systems', v); });
    (uc.partners||[]).forEach(function(v){ push('partners', v); });
    (uc.products||[]).forEach(function(v){ push('products', v); });
    push('author', uc.author);
    push('status', deriveStatus(uc));
  });
  Object.keys(out).forEach(function(k){ out[k].sort(); });
  return out;
}
function impactScore(uc){
  if(!uc.impact) return -1;
  return (uc.impact.hours||0) * 1e6 + (uc.impact.dollars||0);
}
function sortEntries(list, mode){
  var a = (list||[]).slice();
  function byTitle(x,y){ return String(x.title).localeCompare(String(y.title)); }
  if(mode === 'az')      return a.sort(byTitle);
  if(mode === 'impact')  return a.sort(function(x,y){
    return (impactScore(y) - impactScore(x)) || byTitle(x,y); });
  if(mode === 'industry')return a.sort(function(x,y){
    return String(x.industry).localeCompare(String(y.industry)) || byTitle(x,y); });
  return a.sort(function(x,y){
    return String(y.added).localeCompare(String(x.added)) || byTitle(x,y); });
}
// Per-figure provenance. An impact carries basis:{hours:...,dollars:...}; a
// figure counts as sourced ONLY when the entry says so, so anything missing,
// malformed or unknown falls back to 'estimated' and can never over-claim.
function basisOf(impact, key){
  var b = impact && impact.basis;
  return (b && typeof b === 'object' && b[key] === 'sourced') ? 'sourced' : 'estimated';
}
// There is deliberately NO aggregation of impact figures anywhere in this
// portal. A hero band of totals used to sit at the top of the page, with a
// summing helper behind it; both are gone. Impact is reported per entry only,
// which also means an impactModel - a table of PLACEHOLDER inputs, never a
// measured figure - has nothing it could ever be summed into. A contract test
// asserts no summing helper and no total element comes back.
function initials(customer){
  var parts = String(customer||'').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '—';
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}
function formatNumber(n){ return String(n||0).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
/* PURE:END */
/* ────────────────────────────────────────────────────────────────
   USE CASES — this is the only block you ever edit.
   Copy the template, fill it in, add it to the array. That is it.

   EVERY entry carries ALL 23 keys, in EXACTLY the order below. An entry with
   nothing to put in a field gets '' or [] or null — never a missing key. A
   contract test compares Object.keys() against the documented order on every
   entry, so a key in the wrong place or a key left out fails the build.

   industry, systems, partners, products and author are CONTROLLED VOCABULARY.
   Their values must come from the five CANON_ arrays declared just below this
   comment — do not invent a new spelling or a new value without adding it to
   the canon list first, and prune a canon value when the last entry using it
   goes, or it becomes a dropdown option that matches nothing.

   {
     id:            'kebab-case-unique-id',
     title:         'What the prototype is called',
     customer:      'Customer or account name',
     industry:      'One industry, e.g. Financial services — must be in CANON_INDUSTRIES',
     author:        'Who built it — must be in CANON_AUTHORS. Shown on the card face,
                     searchable, and one of the six dropdown facets.',
     summary:       'One or two lines shown on the card.',
     narrative:     'The full problem statement, in prose, shown as the lead paragraph of
                     the detail overlay. Blank lines separate paragraphs. '' if none.',
     impact:        { hours:    480,
                      dollars:  14400,
                      basis:    {hours:'sourced', dollars:'estimated'},
                      note:     'per fee cycle',
                      workings: '9 manual steps x ~12 min x ~40 documents a week x 48 weeks.' },
                    //  ^ use null when the prototype gives you no basis at all.
                    //    An honest null is better than an invented number.
                    //
                    //    impact is either null or an object with EXACTLY these five
                    //    keys, in this order: hours, dollars, basis, note, workings.
                    //
                    //    basis records provenance PER FIGURE, because an entry can
                    //    legitimately have a sourced hours figure and an estimated
                    //    dollar figure - the dollars are derived by multiplying by a
                    //    rate the source never mentions. Use 'sourced' only when the
                    //    prototype literally states that number; anything else is
                    //    'estimated' and renders muted, smaller and prefixed "Est.".
                    //
                    //    workings is REQUIRED whenever either basis value is
                    //    'estimated'. State the assumptions in one or two sentences -
                    //    it is shown to the reader as the justification for the number.
                    //
                    //    dollars for an estimated figure must equal
                    //    hours x RATE_USD_PER_HOUR. A test enforces it, so change the
                    //    constant, then the dollars - never one without the other.
     impactModel:   { inputs:  [{name:'Invoices per month', placeholder:'10,000',
                                 source:'AP team'}],
                      example: 'The arithmetic worked through with those placeholders.',
                      unit:    'cost per invoice' },
                    //  ^ null when the source states no model.
                    //
                    //    impactModel is NOT impact and must NEVER be promoted into it.
                    //    It is a table of PLACEHOLDER inputs an SE re-runs live with
                    //    the customer's own numbers. The bar for impact.basis
                    //    'estimated' is a figure grounded in something the source
                    //    states about THAT account; a placeholder table is not that.
                    //    The overlay renders it under "Sizing model — not a measured
                    //    figure", and there is no aggregate figure anywhere in the
                    //    portal for it to leak into. Tests enforce both.
     demoFlow:      ['One entry per step, in order, in the words you would use while
                      presenting'],          // [] if none. Rendered as a numbered list.
     partners:      ['LTIMindtree'],           // values from CANON_PARTNERS
     partnersNote:  'Why that partner, whose asset it is, or that no partner is named
                     and you need to find out.',   // '' if none
     systems:       ['SAP','NetSuite'],        // values from CANON_SYSTEMS — named products only
                                               // systems the demo ACTUALLY integrates
     adjacentSystems: ['A tax engine if there is VAT or GST treatment'],
                    //  ^ adjacent / commonly raised only. Anything the demo really
                    //    integrates belongs in `systems` and must not be repeated
                    //    here. Free text, not controlled vocabulary, because these
                    //    are conversation prompts rather than facet values — they
                    //    render as dashed chips under their own heading. [] if none.
     products:      ['Integration','Agentstudio'], // values from CANON_PRODUCTS
     conversations: ['Where this use case is useful in a customer conversation'],
     misc:          'Anything else that makes it interesting.',
     tags:          ['extra','search','terms'],
     url:           'use-case-prototypes/kebab-case-unique-id.html',
                    //  ^ relative path to the local copy while the demo runs from file://.
                    //    A published https:// URL is equally valid once available;
                    //    use '' only if nothing exists yet.
     relatedPages:  [{label:'Start here — the written narrative',
                      file:'use-case-prototypes/kebab-case-unique-id-why.html'}],
                    //  ^ companion pages that exist in use-case-prototypes/ but are
                    //    not catalogued as their own use case. `file` is a relative

  {
    id: 'sea-data-product-assistant',
    title: 'SEA regional performance, data products and an agent over two ERPs',
    customer: 'Boomi internal build',
    industry: 'Cross-industry',
    author: 'Richard Yang',
    summary: 'A South-East Asia region running four subsidiaries across SAP and Oracle EBS gets one governed answer instead of two conflicting ones: Boomi Data Hub settles the golden record field by field, currency is normalised, consumption runs through a governed API, and a Boomi Agentstudio agent can only see what that API exposes.',
    narrative: 'Head office asks how South-East Asia did last month and gets two different answers from two competent analysts, because the two ERPs do not agree on what they are describing. Nobody is wrong and nothing errors — the report just runs, and the number is wrong by a quarter of the region.\n\nThe fix is not another report. It is a governed data product: Boomi Data Hub settles the golden record field by field (Finance owns currency and tax ID, Operations owns trading status and entity owner), currency is normalised to one comparable number, consumption is through a governed API, and an agent can only see what the product exposes.',
    impact: null,
    impactModel: {inputs:[{name:'Analyst days per monthly close reconciling entities', placeholder:'6', source:'Group finance'},
                          {name:'Loaded analyst cost per day', placeholder:'$450', source:'Finance'},
                          {name:'Months per year', placeholder:'12', source:'Fixed'},
                          {name:'Capital allocated on these numbers per year', placeholder:'Ask for it', source:'Ask. This is the real number.'}],
                  example:'6 days x $450 x 12 months is about $32k a year of reconciliation labour. That is the small number and you should say so. The argument that lands is different: the board pack decides where next quarter\'s capital and headcount go, a number wrong by a quarter of the region misallocates both, and the only way anyone currently finds out is if two people happen to compare notes. Ask what a quarter\'s misallocated capital is worth and let them answer.',
                  unit:'analyst days per monthly close, with misallocated capital as the real number'},
    demoFlow: ['Start with the narrative page, why.html. It is written, not a UI: the situation, the two conflicting answers, the three reasons they disagree, what was changed, and the result. Read it or walk it; it sets up everything else.',
               'Open the flow explorer, flow.html. Pick a subsidiary and see that entity\'s data at each stage: the two arguing ERPs, the golden record that settles them (with which source won which field, and why), currency normalisation, the governed API, and the agent\'s restricted view. The standout line is that two different sources win different fields on the same record — there is no best system, only a best system per attribute.',
               'Open the catalogue entry, catalog.html: owner, stewards, the contract, the guarantees.',
               'Open the assistant itself. Three governed data products behind one conversation. Ask who the entity owner for Vietnam is, or whether we can invoice Thailand, and watch the status line name the tool it decided to call.',
               'The runbook page, demo-flow.html, is the delivery script for all of the above.'],
    partners: [],
    partnersNote: 'No partner is named — needs your input. There is no partner branding anywhere in the artifact.',
    systems: ['Oracle', 'SAP'],
    adjacentSystems: ['The consolidation tool — OneStream, Tagetik or HFM',
                      'The BI layer that currently produces the conflicting reports',
                      'The data catalogue, if they already have one'],
    products: ['Data Hub', 'Agentstudio', 'Integration'],
    conversations: ['CFO or chief data officer conversation about why a report is wrong by a quarter of the region and nobody notices',
                    'MDM/data-governance conversation stalled on “why do we need golden records at all”'],
    misc: 'No measured figure — a model, not a claim. Reconciliation labour is the small, easy number: placeholder inputs (6 analyst-days per monthly close, $450 loaded analyst cost/day, 12 months/year) work out to about $32k/year, and the page says to call that the small number. The argument that actually lands is decision risk: the board pack decides where next quarter’s capital and headcount go, a number wrong by a quarter of the region misallocates both, and today the only way anyone finds out is if two people happen to compare notes — ask what a quarter’s misallocated capital is worth and let the customer answer. This is a five-page, order-matters asset: why.html (a written narrative of the failure and the fix, no UI, best for an executive and sceptical room) first, then flow.html (per-subsidiary explorer showing which source ERP wins which field on the golden record), catalog.html (the data product’s owner, stewards and contract), index.html (the three-data-product conversational assistant), and demo-flow.html (the delivery runbook) — copied here as sea-data-product-assistant-why.html, -flow.html, -catalog.html and -demo-flow.html alongside the assistant itself. The honest architectural point worth saying out loud: three data products, three shapes, and only two of them need Data Hub at all — attributes belong in the golden record, measures do not. The browser never sees an auth token; the companion server injects the Authorization header, which also sidesteps CORS. Live mode needs a DEMO_DEPLOYMENT_ID in a .env file the original server reads two directories up; not present in this copy, so it runs simulated here.',
    tags: ['data governance', 'MDM', 'SAP', 'Oracle EBS', 'golden record', 'Agentstudio', 'multi-page'],
    url: 'use-case-prototypes/sea-data-product-assistant.html',
    relatedPages: [{label:'Start here — why this exists, the written narrative', file:'use-case-prototypes/sea-data-product-assistant-why.html'},
                   {label:'Flow explorer — which source wins which field', file:'use-case-prototypes/sea-data-product-assistant-flow.html'},
                   {label:'Catalogue entry — owner, stewards and contract', file:'use-case-prototypes/sea-data-product-assistant-catalog.html'},

    summary: 'An invoice approved in Zoho CRM syncs into NetSuite the moment it is approved, one invoice per event, reporting back one of four outcomes — synced, duplicate skipped, customer unmapped, or error — with a Boomi Agentstudio agent able to check mappings and trigger a sync under an approval gate.',

var PAGE = 24;
var STATE = {
  query:'', sort:'recent', shown:PAGE,
  filters:{industry:[],systems:[],partners:[],products:[],author:[],status:[]}
};

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function visibleEntries(){
  var out = USE_CASES.filter(function(uc){
    return matchesQuery(uc, STATE.query) && matchesFilters(uc, STATE.filters);
  });
  return sortEntries(out, STATE.sort);
}
// A sourced figure keeps the large coral treatment. An estimated one is muted,
// smaller and prefixed "Est." - never the same visual weight, so no reader can
// mistake an estimate for something the source measured.
// Dollars are "addressed", never "saved", for the same reason the hours label is:
// an hours figure can be a current-effort baseline rather than a realised saving,
// and the dollar figure derived from it inherits that caveat.
function impactHtml(uc){
  var im = uc.impact;
  // No figure, but a costing model? Say so. "Impact TBD" on a tile that
  // carries a full sizing model is the one thing that would bury it.
  if(!im) return '<div class="impact-tbd">'
    + (uc.impactModel ? 'Sizing model — no measured figure' : 'Impact TBD') + '</div>';
  var out = '';
  if(im.hours){
    if(basisOf(im,'hours') === 'sourced'){
      out += '<div class="impact"><span class="impact-n">' + formatNumber(im.hours)
          +  '</span><span class="impact-u">hours addressed'
          +  (im.note ? ' · ' + esc(im.note) : '') + '</span></div>';
      if(im.dollars && basisOf(im,'dollars') === 'estimated')
        out += '<div class="impact-est">Est. $' + formatNumber(im.dollars) + ' addressed</div>';
      else if(im.dollars)
        out += '<div class="impact-u">$' + formatNumber(im.dollars) + ' addressed</div>';
    } else {
      out += '<div class="impact-est">Est. ' + formatNumber(im.hours) + ' hrs/yr'
          +  (im.dollars ? ' · $' + formatNumber(im.dollars) + ' addressed' : '') + '</div>';
    }
    return out;
  }
  if(im.dollars){
    if(basisOf(im,'dollars') === 'sourced')
      return '<div class="impact"><span class="impact-n">$' + formatNumber(im.dollars)
        + '</span><span class="impact-u">dollars addressed'
        + (im.note ? ' · ' + esc(im.note) : '') + '</span></div>';
    return '<div class="impact-est">Est. $' + formatNumber(im.dollars) + ' addressed</div>';
  }
  return '<div class="impact-tbd">'
    + (uc.impactModel ? 'Sizing model — no measured figure' : 'Impact TBD') + '</div>';
}
function cardHtml(uc){
  var st = deriveStatus(uc);
  var chips = (uc.systems||[]).concat(uc.products||[]).slice(0,4)
    .map(function(v){
      var facet = (uc.systems||[]).indexOf(v) !== -1 ? 'systems' : 'products';
      return '<span class="chip" data-facet="' + facet + '" data-value="' + esc(v) + '">'
        + esc(v) + '</span>';
    }).join('');
  return '<button class="card" type="button" data-id="' + esc(uc.id) + '">'
    + '<div class="card-strip"><span class="card-init">' + esc(uc.industry || 'Industry TBD') + '</span></div>'
    + '<div class="card-body">'
    +   '<div class="card-title">' + esc(uc.title) + '</div>'
    +   '<div class="card-cust">' + esc(uc.customer) + '</div>'
    +   '<div class="card-auth"><i class="ph ph-user-circle" aria-hidden="true"></i>'
    +     'Built by ' + esc(uc.author) + '</div>'
    +   '<div class="card-sum">' + esc(uc.summary) + '</div>'
    +   impactHtml(uc)
    +   '<div class="chips">' + chips + '</div>'
    +   '<div class="badge ' + st + '"><span class="dot"></span>'
    +     STATUS_LABELS[st] + '</div>'
    + '</div></button>';
}
function renderGrid(){
  var list = visibleEntries();
  var slice = list.slice(0, STATE.shown);
  var host = document.querySelector('#grid .wrap');
  if(!list.length){
    host.innerHTML = '<div class="empty">No use cases match. Try clearing a filter.</div>';
    return;
  }
  host.innerHTML = '<div class="grid">' + slice.map(cardHtml).join('') + '</div>'
    + (list.length > slice.length
        ? '<button class="more" id="show-more" type="button">Show '
          + Math.min(PAGE, list.length - slice.length) + ' more</button>'
        : '');
  var more = document.getElementById('show-more');
  if(more) more.addEventListener('click', function(){ STATE.shown += PAGE; renderGrid(); });
}
// Short labels, because six of these plus a search box, a sort control, a
// count and Clear all have to share ONE line. The longer "All industries"
// wording is swapped in only while the option list is open (see
// wirePlaceholderSwap).
var FACET_LABELS = {industry:'Industry', systems:'Systems',
  partners:'Partners', products:'Products', author:'Author', status:'Status'};
var FACET_ALL = {industry:'All industries', systems:'All systems',
  partners:'All partners', products:'All Boomi products',
  author:'All authors', status:'All statuses'};
var STATUS_LABELS = {published:'Published', local:'Local preview', pending:'Coming soon'};
// Stable display order for each dropdown. Values come from deriveFacets(),
// never hardcoded, so the options always match the data — this just decides
// the ORDER they appear in: canonical order first (from the CANON_ arrays
// declared above USE_CASES), then anything else deriveFacets() found that
// isn't in the canon list, so a value is never silently dropped.
var CANON_ORDER = {industry:CANON_INDUSTRIES, systems:CANON_SYSTEMS,
  partners:CANON_PARTNERS, products:CANON_PRODUCTS, author:CANON_AUTHORS,
  status:['published','local','pending']};
function orderedFacetValues(key, values){
  var canon = CANON_ORDER[key] || [];
  var present = {};
  values.forEach(function(v){ present[v] = true; });
  var out = canon.filter(function(v){ return present[v]; });
  values.forEach(function(v){ if(out.indexOf(v) === -1) out.push(v); });
  return out;
}

function renderControls(){
  var f = deriveFacets(USE_CASES);
  var selects = Object.keys(FACET_LABELS).map(function(key){
    var label = FACET_LABELS[key];
    var opts = '<option value="" data-short="' + esc(label)
      + '" data-all="' + esc(FACET_ALL[key]) + '">' + esc(label) + '</option>'
      + orderedFacetValues(key, f[key]).map(function(v){
          var text = key === 'status' ? esc(STATUS_LABELS[v] || v) : esc(v);
          return '<option value="' + esc(v) + '">' + text + '</option>';
        }).join('');
    return '<select class="fsel" data-facet="' + key
      + '" aria-label="Filter by ' + esc(label) + '">' + opts + '</select>';
  }).join('');

  document.querySelector('#controls .wrap').innerHTML =
    '<div class="ctl-row">'
    + '<label class="search"><i class="ph ph-magnifying-glass" aria-hidden="true"></i>'
    +   '<input id="q" type="search" placeholder="Search use cases, systems, partners, conversations…"'
    +   ' aria-label="Search use cases"></label>'
    + selects
    + '<select id="sort" aria-label="Sort use cases">'
    +   '<option value="recent">Recently added</option>'
    +   '<option value="az">A–Z</option>'
    +   '<option value="impact">Highest impact</option>'
    +   '<option value="industry">Industry</option>'
    + '</select>'
    + '<span id="count"></span>'
    + '<button id="clear" type="button">Clear all</button>'
    + '</div>';

  var qEl = document.getElementById('q');
  var t;
  qEl.addEventListener('input', function(){
    clearTimeout(t);
    t = setTimeout(function(){ STATE.query = qEl.value; STATE.shown = PAGE; applyAndRender(); }, 120);
  });
  document.getElementById('sort').addEventListener('change', function(e){
    STATE.sort = e.target.value; STATE.shown = PAGE; applyAndRender();
  });
  document.getElementById('clear').addEventListener('click', clearAll);
  document.querySelector('#controls .wrap').addEventListener('change', function(e){
    var sel = e.target.closest('select.fsel');
    if(sel) setFilter(sel.dataset.facet, sel.value);
  });
  var fsels = document.querySelectorAll('#controls select.fsel');
  for(var i=0;i<fsels.length;i++) wirePlaceholderSwap(fsels[i]);
}
// Cosmetic only, and the option's VALUE never changes: the closed control
// reads "Industry" so ten controls fit one line, and the open list reads
// "All industries" so the reset choice is unambiguous. If these events never
// fire the list simply reads "Industry", which is still correct.
function wirePlaceholderSwap(sel){
  var o = sel.options[0];
  if(!o) return;
  function full(){  o.textContent = o.getAttribute('data-all'); }
  function brief(){ o.textContent = o.getAttribute('data-short'); }
  sel.addEventListener('mousedown', full);
  sel.addEventListener('focus', full);
  sel.addEventListener('blur', brief);
  sel.addEventListener('change', brief);
}
// Shared by both the dropdowns and a card chip click: a single-select facet
// is either constrained to exactly one value or unconstrained ('' / no
// value), matching what the pure matchesFilters() already expects — a
// one-element array for "equals this" and an empty array for "no constraint".
function setFilter(facet, value){
  STATE.filters[facet] = value ? [value] : [];
  STATE.shown = PAGE;
  applyAndRender();
}
function clearAll(){
  STATE.query = ''; STATE.sort = 'recent'; STATE.shown = PAGE;
  Object.keys(STATE.filters).forEach(function(k){ STATE.filters[k] = []; });
  document.getElementById('q').value = '';
  document.getElementById('sort').value = 'recent';
  applyAndRender();
}
function syncControls(){
  var selects = document.querySelectorAll('#controls select.fsel');
  for(var i=0;i<selects.length;i++){
    var s = selects[i];
    var arr = STATE.filters[s.dataset.facet] || [];
    s.value = arr.length ? arr[0] : '';
  }
}
function applyAndRender(){
  syncControls();
  document.getElementById('count').textContent =
    'Showing ' + visibleEntries().length + ' of ' + USE_CASES.length;
  renderGrid();
}
var lastFocused = null;

function sectionHtml(label, body){
  return body ? '<div class="sec"><h3>' + label + '</h3>' + body + '</div>' : '';
}
function listHtml(arr){
  if(!arr || !arr.length) return '';
  return '<ul>' + arr.map(function(v){ return '<li>' + esc(v) + '</li>'; }).join('') + '</ul>';
}
function chipsHtml(arr, extra){
  if(!arr || !arr.length) return '';
  var cls = extra ? 'chip ' + extra : 'chip';
  return '<div class="chips">' + arr.map(function(v){
    return '<span class="' + cls + '">' + esc(v) + '</span>'; }).join('') + '</div>';
}
// A numbered running order. demoFlow is ordered by contract, so the numbers
// are the steps, not decoration.
function stepsHtml(arr){
  if(!arr || !arr.length) return '';
  return '<ol>' + arr.map(function(v){ return '<li>' + esc(v) + '</li>'; }).join('') + '</ol>';
}
// narrative may carry blank-line paragraph breaks; every paragraph is escaped.
function parasHtml(text, cls){
  var t = String(text == null ? '' : text).trim();
  if(!t) return '';
  return t.split(/\n\s*\n/).map(function(p){
    return '<p class="' + cls + '">' + esc(p.replace(/\s*\n\s*/g, ' ')) + '</p>';
  }).join('');
}
// THE MODEL BLOCK. This is placeholder arithmetic an SE re-runs live with the
// customer's own numbers - it is NOT a measured result and never becomes one.
// The heading, the warning line and the "Placeholder" column header all say
// so, because a table of numbers in a deal room is read as fact by default.
function modelHtml(mo){
  if(!mo) return '';
  var rows = (mo.inputs||[]).map(function(i){
    return '<tr><td>' + esc(i.name) + '</td><td class="ph">' + esc(i.placeholder)
      + '</td><td>' + esc(i.source) + '</td></tr>';
  }).join('');
  return '<div class="sec model">'
    + '<h3>Sizing model — not a measured figure</h3>'
    + '<p class="model-warn">Nothing below is measured, and none of it is this account\'s'
    + ' data. Replace every placeholder with the customer\'s own number before you say'
    + ' any of it out loud.</p>'
    + (mo.unit ? '<p class="model-unit">What it measures: <strong>' + esc(mo.unit)
        + '</strong></p>' : '')
    + (rows ? '<table class="model-t"><thead><tr><th>Input</th><th>Placeholder</th>'
        + '<th>Where to get the real figure</th></tr></thead><tbody>' + rows
        + '</tbody></table>' : '')
    + (mo.example ? '<p class="model-ex"><span class="model-ex-l">Worked example,'
        + ' using the placeholders above</span>' + esc(mo.example) + '</p>' : '')
    + '</div>';
}
// Companion pages that exist on disk but are not catalogued as their own use
// case. Same relative-path resolution the cards and the open button use.
function relatedHtml(pages){
  if(!pages || !pages.length) return '';
  return '<div class="rel">' + pages.map(function(p){
    return '<a href="' + esc(p.file) + '" target="_blank" rel="noopener">'
      + '<i class="ph ph-arrow-up-right" aria-hidden="true"></i>' + esc(p.label) + '</a>';
  }).join('') + '</div>';
}
// Every figure in the sheet is labelled with where it came from, one label per
// figure - an entry can carry sourced hours and estimated dollars at once.
function statBlock(value, label, basis){
  var est = basis === 'estimated';
  return '<div><div class="stat-n' + (est ? ' est' : '') + '">'
    + (est ? 'Est. ' : '') + value + '</div>'
    + '<div class="stat-l">' + label + '</div>'
    + '<div class="stat-b">' + (est ? 'Estimated' : 'Sourced') + '</div></div>';
}
function openDetail(id){
  var uc = USE_CASES.filter(function(u){ return u.id === id; })[0];
  if(!uc) return;
  lastFocused = document.activeElement;
  var st = deriveStatus(uc);
  var im = uc.impact;
  var stats = '';
  if(im && im.hours)   stats += statBlock(formatNumber(im.hours), 'Hours addressed', basisOf(im,'hours'));
  if(im && im.dollars) stats += statBlock('$' + formatNumber(im.dollars), 'Dollars addressed', basisOf(im,'dollars'));

  var el = document.getElementById('overlay');
  el.innerHTML = '<div class="sheet" role="document"><div class="sheet-strip"></div>'
    + '<div class="sheet-in">'
    +   '<div class="sheet-head"><div>'
    +     '<div class="eyebrow">' + esc(uc.industry || 'Industry TBD') + '</div>'
    +     '<h2 id="sheet-title">' + esc(uc.title) + '</h2>'
    +     '<div class="sheet-cust">' + esc(uc.customer) + '</div>'
    +     '<div class="sheet-auth">Built by ' + esc(uc.author) + '</div>'
    +   '</div><button class="xbtn" id="sheet-close" type="button" aria-label="Close">'
    +     '<i class="ph ph-x" aria-hidden="true"></i></button></div>'
    +   parasHtml(uc.narrative, 'lead')
    +   (stats ? '<div class="sheet-stats">' + stats + '</div>'
            : (uc.impactModel ? '' : '<div class="sec"><p class="impact-tbd">Impact TBD</p></div>'))
    +   (im && im.note ? '<div class="sec"><p>' + esc(im.note) + '</p></div>' : '')
    +   sectionHtml('How this number is derived',
          im && im.workings ? '<p class="workings">' + esc(im.workings) + '</p>' : '')
    +   modelHtml(uc.impactModel)
    +   sectionHtml('Summary', uc.summary ? '<p>' + esc(uc.summary) + '</p>' : '')
    +   sectionHtml('How to run the demo', stepsHtml(uc.demoFlow))
    +   sectionHtml('Where this lands in a conversation', listHtml(uc.conversations))
    +   sectionHtml('Systems this demo integrates', chipsHtml(uc.systems))
    +   sectionHtml('Adjacent systems — commonly raised, not integrated here',
          chipsHtml(uc.adjacentSystems, 'adj'))
    +   sectionHtml('Boomi products', chipsHtml(uc.products))
    +   sectionHtml('Partners', chipsHtml(uc.partners)
          + (uc.partnersNote ? '<p class="workings">' + esc(uc.partnersNote) + '</p>' : ''))
    +   sectionHtml('Companion pages', relatedHtml(uc.relatedPages))
    +   sectionHtml('Tags', chipsHtml(uc.tags))
    +   sectionHtml('Notes', uc.misc ? '<p>' + esc(uc.misc) + '</p>' : '')
    +   (uc.originalPath ? '<div class="runfrom"><span class="lbl">Run live from</span>'
          + '<code>' + esc(uc.originalPath) + '</code></div>' : '')
    +   (st === 'published' || st === 'local'
        ? '<a class="open-btn" href="' + esc(uc.url) + '" target="_blank" rel="noopener">'
          + 'Open prototype <i class="ph ph-arrow-up-right" aria-hidden="true"></i></a>'
        : '<div class="soon"><i class="ph ph-clock" aria-hidden="true"></i>'
          + 'Coming soon — not yet published</div>')
    + '</div></div>';

  el.setAttribute('role','dialog');
  el.setAttribute('aria-modal','true');
  el.setAttribute('aria-labelledby','sheet-title');
  el.hidden = false;
  document.getElementById('sheet-close').focus();
}
function closeDetail(){
  var el = document.getElementById('overlay');
  el.hidden = true;
  el.innerHTML = '';
  if(lastFocused && lastFocused.focus) lastFocused.focus();
}
document.getElementById('overlay').addEventListener('click', function(e){
  if(e.target.id === 'overlay' || e.target.closest('#sheet-close')) closeDetail();
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && !document.getElementById('overlay').hidden) closeDetail();
});

renderControls();
applyAndRender();
document.getElementById('grid').addEventListener('click', function(e){
  var chip = e.target.closest('.chip[data-facet]');
  if(chip){ setFilter(chip.dataset.facet, chip.dataset.value); return; }
  var card = e.target.closest('.card');
  if(card) openDetail(card.dataset.id);
});

(function(){
  var root = document.documentElement;
  var btn = document.getElementById('theme-toggle');
  var lbl = document.getElementById('theme-label');
  btn.addEventListener('click', function(){
    var dark = root.getAttribute('data-theme') === 'dark';
    root.setAttribute('data-theme', dark ? 'light' : 'dark');
    lbl.textContent = dark ? 'Dark' : 'Light';
    btn.setAttribute('aria-label', dark ? 'Switch to dark theme' : 'Switch to light theme');
    btn.querySelector('i').className = dark ? 'ph ph-moon' : 'ph ph-sun';
  });
})();
</script>
